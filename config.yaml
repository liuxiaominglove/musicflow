# ============================================
# 智能音乐播放器 - 定时播放配置
# ============================================

# 全局设置
global:
  # 音乐存储目录
  music_dir: "./music_library"
  # 默认播放音量 (0.0 ~ 1.0)
  default_volume: 0.7
  # 每次播放的歌曲数量 (0 = 全部播放)
  songs_per_session: 5
  # 播放模式: "sequential"(顺序) / "random"(随机)
  play_mode: "random"

# ============================================
# 定时播放计划
# ============================================
schedules: []

# ============================================
# 本地音乐库（如果你已有本地音乐文件，在这里指定）
# 支持绝对路径和相对路径
# ============================================
local_playlists:
