<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>MusicFlow</title>

<!-- PWA Meta -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MusicFlow">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#121212">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><rect width='180' height='180' rx='36' fill='%23121212'/><text x='90' y='115' text-anchor='middle' font-size='90' fill='%23ff4757'>🎵</text></svg>">

<style>
/* ============================================
   Mobile Music Player - Dark Theme
   ============================================ */
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --bg: #121212;
  --bg2: #1a1a2e;
  --card: #1e1e32;
  --text: #e0e0e0;
  --text2: #a0a0b8;
  --muted: #606078;
  --accent: #ff4757;
  --accent2: #ff6b81;
  --gold: #ffc048;
  --green: #2ed573;
  --border: #2a2a40;
  --radius: 12px;
  --tab-h: 56px;
  --mini-h: 64px;
}

html, body {
  height: 100%; width: 100%;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "PingFang SC", "Helvetica Neue", sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}

/* Status Bar Safe Area */
.safe-top {
  height: calc(var(--safe-top) + 8px);
  background: var(--bg2);
}

/* ============================================
   Main Layout
   ============================================ */
.app {
  display: flex; flex-direction: column;
  height: 100%;
}

/* ---- Header ---- */
.header {
  background: var(--bg2);
  padding: 12px 16px;
  display: flex; align-items: center; justify-content: space-between;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
  z-index: 10;
}

.header .logo {
  font-size: 22px; font-weight: 800;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: -0.5px;
}

.header-actions {
  display: flex; gap: 12px; align-items: center;
}

/* ---- Tab Content ---- */
.tab-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding-bottom: 8px;
}

/* ---- Bottom Tab Bar ---- */
.tab-bar {
  height: calc(var(--tab-h) + var(--safe-bottom));
  background: var(--bg2);
  border-top: 1px solid var(--border);
  display: flex;
  flex-shrink: 0;
  z-index: 20;
  padding-bottom: var(--safe-bottom);
}

.tab-item {
  flex: 1; display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  color: var(--muted); font-size: 10px; gap: 3px;
  transition: color 0.2s; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}

.tab-item.active { color: var(--accent); }
.tab-item svg { width: 22px; height: 22px; }
.tab-item span { font-weight: 600; font-size: 10px; }

/* ---- Mini Player (in tab bar area) ---- */
.mini-player {
  position: fixed; bottom: calc(var(--tab-h) + var(--safe-bottom));
  left: 0; right: 0; height: var(--mini-h);
  background: var(--card);
  border-top: 1px solid var(--border);
  display: flex; align-items: center;
  padding: 0 12px; gap: 12px;
  z-index: 15;
  transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.mini-player.hidden { transform: translateY(100%); }

.mini-player .mini-cover {
  width: 44px; height: 44px; border-radius: 8px;
  background: linear-gradient(135deg, var(--accent), #6c5ce7);
  display: flex; align-items: center; justify-content: center;
  font-size: 20px; flex-shrink: 0;
  animation: spin 8s linear infinite paused;
}
.mini-player.playing .mini-cover { animation-play-state: running; }

@keyframes spin { to { transform: rotate(360deg); } }

.mini-player .mini-info {
  flex: 1; min-width: 0; overflow: hidden;
}

.mini-player .mini-title {
  font-size: 14px; font-weight: 600; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}

.mini-player .mini-artist {
  font-size: 11px; color: var(--text2); margin-top: 1px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.mini-player .mini-controls {
  display: flex; gap: 6px; align-items: center; flex-shrink: 0;
}

.mini-btn {
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--accent); color: #fff; border: none;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; font-size: 16px;
  -webkit-tap-highlight-color: transparent;
  transition: transform 0.15s;
}
.mini-btn:active { transform: scale(0.9); }

.mini-btn-sm {
  width: 28px; height: 28px; border-radius: 50%;
  background: transparent; border: none; color: var(--text2);
  font-size: 13px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  -webkit-tap-highlight-color: transparent;
}
.mini-btn-sm:active { color: var(--text); transform: scale(0.9); }

/* ---- Now Playing Full Screen ---- */
.now-playing {
  position: fixed; top: 0; left: 0; right: 0; bottom: 0;
  background: var(--bg);
  z-index: 30;
  display: flex; flex-direction: column;
  transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1);
  padding-top: var(--safe-top);
}

.now-playing.hidden { transform: translateY(100%); }

.np-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; flex-shrink: 0;
}

.np-back {
  width: 36px; height: 36px; border-radius: 50%;
  background: rgba(255,255,255,0.08); border: none; color: var(--text);
  font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}

.np-cover {
  flex: 1; display: flex; align-items: center; justify-content: center;
  padding: 24px 48px;
}

.cover-disc {
  width: 100%; max-width: 280px; aspect-ratio: 1;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), #6c5ce7, #00d2d3);
  display: flex; align-items: center; justify-content: center;
  font-size: 80px;
  box-shadow: 0 20px 60px rgba(255,71,87,0.25);
  animation: spin 12s linear infinite paused;
  position: relative;
}
.cover-disc.playing { animation-play-state: running; }

.cover-disc::after {
  content: ''; position: absolute;
  width: 36px; height: 36px; border-radius: 50%;
  background: var(--bg);
  top: 50%; left: 50%; transform: translate(-50%, -50%);
}

.np-info {
  padding: 16px 32px; text-align: center; flex-shrink: 0;
}

.np-title {
  font-size: 22px; font-weight: 700; margin-bottom: 4px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden;
}

.np-artist {
  font-size: 15px; color: var(--text2);
}

/* Progress Bar */
.np-progress {
  padding: 0 32px 8px; flex-shrink: 0;
}

.progress-bar {
  width: 100%; height: 4px; border-radius: 2px;
  background: var(--border); position: relative;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
  touch-action: none; -webkit-user-select: none; user-select: none;
}

.progress-click {
  position: absolute; top: -20px; left: 0; right: 0; bottom: -20px;
  z-index: 5; cursor: pointer;
}

.progress-bar .fill {
  height: 100%; border-radius: 2px;
  background: var(--accent); position: relative;
  transition: width 0.1s linear;
}

.progress-bar .thumb {
  width: 14px; height: 14px; border-radius: 50%;
  background: #fff; position: absolute;
  top: 50%; transform: translate(-50%, -50%);
  box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  opacity: 0; transition: opacity 0.2s;
}

.progress-bar:hover .thumb,
.progress-bar:active .thumb,
.progress-bar.dragging .thumb { opacity: 1; }

.progress-times {
  display: flex; justify-content: space-between;
  font-size: 11px; color: var(--muted); margin-top: 6px;
}

/* Now Playing Controls */
.np-controls {
  display: flex; align-items: center; justify-content: center;
  gap: 20px; padding: 8px 32px 32px; flex-shrink: 0;
}

.np-btn-sm {
  width: 44px; height: 44px; border-radius: 50%;
  background: transparent; border: none; color: var(--text);
  font-size: 20px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: transform 0.15s;
}
.np-btn-sm:active { transform: scale(0.85); }

.np-btn-play {
  width: 56px; height: 56px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border: none; color: #fff; font-size: 24px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 20px rgba(255,71,87,0.4);
  transition: transform 0.15s;
}
.np-btn-play:active { transform: scale(0.9); }

/* Loop & Volume Row */
.np-extras {
  display: flex; align-items: center; justify-content: center;
  gap: 24px; padding: 0 32px 16px; flex-shrink: 0;
}

.loop-btn {
  font-size: 12px; font-weight: 700; color: var(--muted);
  background: rgba(255,255,255,0.06); border: none;
  padding: 6px 14px; border-radius: 16px; cursor: pointer;
  transition: all 0.2s;
}
.loop-btn.active { color: var(--accent); background: rgba(255,71,87,0.15); }

.volume-row {
  display: flex; align-items: center; gap: 8px;
}

.volume-row svg { color: var(--text2); flex-shrink: 0; }

.volume-slider {
  -webkit-appearance: none; width: 100px; height: 4px;
  border-radius: 2px; background: var(--border); outline: none;
}
.volume-slider::-webkit-slider-thumb {
  -webkit-appearance: none; width: 16px; height: 16px;
  border-radius: 50%; background: #fff; cursor: pointer;
  box-shadow: 0 2px 6px rgba(0,0,0,0.3);
}

/* ---- Song List ---- */
.section-header {
  padding: 16px 16px 8px; font-size: 13px; font-weight: 700;
  color: var(--text2); text-transform: uppercase; letter-spacing: 0.5px;
}

.song-item {
  display: flex; align-items: center; padding: 10px 16px; gap: 12px;
  cursor: pointer; transition: background 0.15s;
  border-radius: 8px; margin: 1px 8px;
  -webkit-tap-highlight-color: transparent;
}
.song-item:active { background: var(--bg2); }

.song-item .song-index {
  width: 28px; text-align: center; font-size: 14px;
  color: var(--muted); flex-shrink: 0;
}

.song-item .song-cover {
  width: 44px; height: 44px; border-radius: 8px;
  background: linear-gradient(135deg, var(--bg2), var(--border));
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}

.song-item .song-info { flex: 1; min-width: 0; }

.song-item .song-name {
  font-size: 15px; font-weight: 500; white-space: nowrap;
  overflow: hidden; text-overflow: ellipsis;
}

.song-item .song-meta {
  font-size: 12px; color: var(--text2); margin-top: 2px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}

.song-item .song-more {
  width: 32px; height: 32px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  color: var(--muted); font-size: 18px; flex-shrink: 0;
  cursor: pointer;
}

.song-item.now-playing-item {
  background: rgba(255,71,87,0.1);
}

.song-item.now-playing-item .song-name { color: var(--accent); }
.song-item.now-playing-item .song-index { color: var(--accent); font-weight: 700; }

.now-playing-indicator {
  width: 3px; height: 16px; background: var(--accent);
  border-radius: 2px; flex-shrink: 0;
  animation: eq 0.8s ease-in-out infinite alternate;
}
@keyframes eq { to { height: 6px; } }

/* ---- Tag Chips ---- */
.tag-row {
  display: flex; gap: 8px; padding: 8px 16px 4px;
  overflow-x: auto; -webkit-overflow-scrolling: touch;
}
.tag-row::-webkit-scrollbar { display: none; }

.tag-chip {
  padding: 6px 14px; border-radius: 16px;
  background: var(--bg2); color: var(--text2);
  font-size: 13px; white-space: nowrap; cursor: pointer;
  border: 1px solid transparent;
  transition: all 0.2s; flex-shrink: 0;
}
.tag-chip.active {
  background: rgba(255,71,87,0.12);
  color: var(--accent);
  border-color: rgba(255,71,87,0.3);
}

/* ---- Search ---- */
.search-header {
  padding: 12px 16px;
}
.search-input-wrap {
  display: flex; align-items: center; gap: 10px;
  background: var(--card); border-radius: 12px;
  padding: 0 14px; border: 1px solid var(--border);
}
.search-input-wrap:focus-within { border-color: var(--accent); }

.search-input-wrap svg { color: var(--muted); flex-shrink: 0; }

.search-input-wrap input {
  flex: 1; height: 40px; background: transparent;
  border: none; color: var(--text); font-size: 15px; outline: none;
}
.search-input-wrap input::placeholder { color: var(--muted); }

.search-clear {
  width: 28px; height: 28px; border-radius: 50%;
  background: rgba(255,255,255,0.1); border: none; color: var(--muted);
  font-size: 14px; cursor: pointer; display: none;
}
.search-clear.visible { display: flex; align-items: center; justify-content: center; }

.empty-state {
  text-align: center; padding: 60px 32px; color: var(--muted);
}
.empty-state .icon { font-size: 48px; margin-bottom: 12px; }
.empty-state .title { font-size: 16px; font-weight: 600; margin-bottom: 6px; color: var(--text2); }
.empty-state .desc { font-size: 13px; }

/* ---- Loading ---- */
.loading {
  display: flex; align-items: center; justify-content: center;
  padding: 32px; gap: 8px; color: var(--muted);
}
.spinner {
  width: 20px; height: 20px; border: 2px solid var(--border);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin 0.7s linear infinite;
}

/* ---- Toast ---- */
.toast {
  position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
  background: var(--card); color: var(--text);
  padding: 10px 20px; border-radius: 20px; font-size: 13px;
  font-weight: 500; z-index: 100; opacity: 0; pointer-events: none;
  transition: opacity 0.3s; box-shadow: 0 8px 30px rgba(0,0,0,0.4);
}
.toast.show { opacity: 1; }

/* ---- Global ---- */
.btn-icon {
  width: 36px; height: 36px; border-radius: 50%;
  background: rgba(255,255,255,0.08); border: none; color: var(--text);
  font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.2s;
}
.btn-icon:active { background: rgba(255,255,255,0.15); }

.role-badge {
  font-size: 11px; color: var(--green);
  background: rgba(46,213,115,0.12);
  padding: 3px 10px; border-radius: 10px;
  font-weight: 600;
}

.hidden { display: none !important; }

/* Responsive - larger screens */
@media (min-width: 768px) {
  .app { max-width: 500px; margin: 0 auto; border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
  .mini-player, .now-playing { max-width: 500px; left: 50%; transform: translateX(-50%); }
  .mini-player.hidden { transform: translate(-50%, 100%); }
  .now-playing { left: 50%; right: auto; width: 100%; transform: translate(-50%, 0); }
  .now-playing.hidden { transform: translate(-50%, 100%); }
}
</style>
</head>
<body>

<div class="safe-top"></div>

<div class="app">
  <!-- Header -->
  <div class="header">
    <div class="logo">🎵 MusicFlow <span id="roleBadge" class="role-badge hidden"></span></div>
    <div class="header-actions">
      <button class="btn-icon" onclick="refreshLibrary()" title="刷新">🔄</button>
    </div>
  </div>

  <!-- Tab Content: Library -->
  <div class="tab-content" id="tab-library">
    <div class="tag-row" id="tagChips"></div>
    <div class="section-header">歌曲列表</div>
    <div id="songList"></div>
    <div class="loading hidden" id="loadingLib">
      <div class="spinner"></div> 加载中...
    </div>
  </div>

  <!-- Tab Content: Search -->
  <div class="tab-content hidden" id="tab-search">
    <div class="search-header">
      <div class="search-input-wrap">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input type="text" id="searchInput" placeholder="搜索歌曲..." autocomplete="off">
        <button class="search-clear" id="searchClear" onclick="clearSearch()">✕</button>
      </div>
    </div>
    <div id="searchResults"></div>
  </div>

  <!-- Tab Content: Favorites (Rating >= 2) -->
  <div class="tab-content hidden" id="tab-fav">
    <div class="section-header">我的最爱</div>
    <div id="favList"></div>
  </div>
</div>

<!-- Mini Player -->
<div class="mini-player hidden" id="miniPlayer" onclick="openNowPlaying()">
  <div class="mini-cover">🎵</div>
  <div class="mini-info">
    <div class="mini-title" id="miniTitle">未在播放</div>
    <div class="mini-artist" id="miniArtist"></div>
  </div>
  <div class="mini-controls" onclick="event.stopPropagation()">
    <button class="mini-btn-sm" onclick="playPrev()" title="上一首">⏮</button>
    <button class="mini-btn" id="miniPlayBtn" onclick="togglePlay()">▶</button>
    <button class="mini-btn-sm" onclick="playNext()" title="下一首">⏭</button>
  </div>
</div>

<!-- Now Playing Full Screen -->
<div class="now-playing hidden" id="nowPlaying">
  <div class="np-header">
    <button class="np-back" onclick="closeNowPlaying()">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <span style="font-size:13px;color:var(--text2)">正在播放</span>
    <div style="width:36px"></div>
  </div>

  <div class="np-cover">
    <div class="cover-disc" id="coverDisc">🎵</div>
  </div>

  <div class="np-info">
    <div class="np-title" id="npTitle">未在播放</div>
    <div class="np-artist" id="npArtist"></div>
  </div>

  <div class="np-progress">
    <div class="progress-bar" id="progressBar">
      <div class="progress-click" id="progressClick"></div>
      <div class="fill" id="progressFill" style="width:0%">
        <div class="thumb" id="progressThumb" style="left:0%"></div>
      </div>
    </div>
    <div class="progress-times">
      <span id="currentTime">0:00</span>
      <span id="totalTime">0:00</span>
    </div>
  </div>

  <div class="np-controls">
    <button class="np-btn-sm" onclick="playPrev()" title="上一首">⏮</button>
    <button class="np-btn-play" id="npPlayBtn" onclick="togglePlay()">▶</button>
    <button class="np-btn-sm" onclick="playNext()" title="下一首">⏭</button>
  </div>

  <div class="np-extras">
    <button class="loop-btn" id="loopBtn" onclick="cycleLoop()">🔁 列表循环</button>
    <div class="volume-row">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"/></svg>
      <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="70" oninput="setVolume(this.value)">
    </div>
  </div>
</div>

<!-- Bottom Tab Bar -->
<div class="tab-bar">
  <div class="tab-item active" data-tab="library" onclick="switchTab('library')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>
    <span>曲库</span>
  </div>
  <div class="tab-item" data-tab="search" onclick="switchTab('search')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <span>搜索</span>
  </div>
  <div class="tab-item" data-tab="fav" onclick="switchTab('fav')">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
    <span>最爱</span>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<!-- Hidden Audio Element -->
<audio id="audio" preload="metadata"></audio>

<script>
// ============================================
// Global State
// ============================================
const audio = document.getElementById('audio');
let allSongs = [];
let playQueue = [];
let playIndex = -1;
let loopMode = 'all'; // 'off' | 'all' | 'single'
let isPlaying = false;
let currentTag = '';
let isSeeking = false;

// ============================================
// Audio Events
// ============================================
audio.addEventListener('loadedmetadata', () => {
  document.getElementById('totalTime').textContent = formatTime(audio.duration);
});

audio.addEventListener('timeupdate', () => {
  if (!isSeeking && audio.duration) {
    const pct = (audio.currentTime / audio.duration) * 100;
    updateProgress(pct);
    document.getElementById('currentTime').textContent = formatTime(audio.currentTime);
  }
});

audio.addEventListener('play', () => {
  isPlaying = true;
  updatePlayButtons(true);
  document.getElementById('miniPlayer').classList.add('playing');
  document.getElementById('coverDisc').classList.add('playing');
});

audio.addEventListener('pause', () => {
  isPlaying = false;
  updatePlayButtons(false);
  document.getElementById('miniPlayer').classList.remove('playing');
  document.getElementById('coverDisc').classList.remove('playing');
});

audio.addEventListener('ended', () => {
  onSongEnd();
});

audio.addEventListener('error', (e) => {
  showToast('播放出错，请重试');
  console.error('Audio error:', e);
  onSongEnd();
});

audio.addEventListener('waiting', () => {
  // buffering - no visual for now
});

audio.addEventListener('canplay', () => {
  // ready to play
});

// ============================================
// Audio Playback Control
// ============================================
function loadAndPlay(song, idx) {
  playIndex = idx;

  const artist = song.artist || '';
  document.getElementById('miniTitle').textContent = song.name;
  document.getElementById('miniArtist').textContent = artist || song.tag || '';
  document.getElementById('npTitle').textContent = song.name;
  document.getElementById('npArtist').textContent = artist || song.tag || '';
  document.getElementById('miniPlayer').classList.remove('hidden');

  // Update emoji on cover
  const emojis = ['🎵', '🎶', '🎼', '🎹', '🎸', '🥁', '🎤', '🎧', '💿', '🎷'];
  const emoji = emojis[Math.abs(hashCode(song.name)) % emojis.length];
  document.querySelector('.mini-cover').textContent = emoji;
  document.getElementById('coverDisc').textContent = emoji;

  // Set audio source (must be set before openNowPlaying)
  const url = `/music/${encodeURI(song.rel_path)}`;
  audio.src = url;
  audio.load();
  audio.play().catch(e => {
    console.error('Play failed:', e);
    showToast('播放失败，请检查网络');
  });

  // 自动打开全屏播放界面，让用户看到进度条和控制按钮
  openNowPlaying();

  // Update song list highlighting
  renderSongList();

  // Update Media Session API
  if ('mediaSession' in navigator) {
    navigator.mediaSession.metadata = new MediaMetadata({
      title: song.name,
      artist: artist || 'MusicFlow',
      artwork: [{ src: '', sizes: '512x512', type: 'image/png' }]
    });
    navigator.mediaSession.setActionHandler('play', togglePlay);
    navigator.mediaSession.setActionHandler('pause', togglePlay);
    navigator.mediaSession.setActionHandler('previoustrack', playPrev);
    navigator.mediaSession.setActionHandler('nexttrack', playNext);
  }
}

function togglePlay() {
  if (!audio.src) {
    // No song loaded, play the first one
    if (playQueue.length > 0) {
      loadAndPlay(playQueue[0], 0);
    }
    return;
  }
  if (audio.paused) {
    audio.play().catch(e => console.error(e));
  } else {
    audio.pause();
  }
}

function updatePlayButtons(playing) {
  const icons = ['▶', '⏸'];
  document.getElementById('miniPlayBtn').textContent = playing ? icons[1] : icons[0];
  document.getElementById('npPlayBtn').textContent = playing ? icons[1] : icons[0];
}

function onSongEnd() {
  const len = playQueue.length;
  if (len === 0) return;

  if (loopMode === 'single') {
    audio.currentTime = 0;
    audio.play().catch(() => {});
    return;
  }

  if (loopMode === 'all') {
    playIndex = (playIndex + 1) % len;
    loadAndPlay(playQueue[playIndex], playIndex);
    return;
  }

  // 'off' mode
  if (playIndex < len - 1) {
    playIndex++;
    loadAndPlay(playQueue[playIndex], playIndex);
  } else {
    // End of queue
    isPlaying = false;
    updatePlayButtons(false);
    document.getElementById('miniPlayer').classList.remove('playing');
    document.getElementById('coverDisc').classList.remove('playing');
    updateProgress(0);
  }
}

function playNext() {
  const len = playQueue.length;
  if (len === 0 || playIndex < 0) return;
  const next = (playIndex + 1) % len;
  loadAndPlay(playQueue[next], next);
}

function playPrev() {
  const len = playQueue.length;
  if (len === 0 || playIndex < 0) return;
  // If more than 3 seconds in, restart current; else go to prev
  if (audio.currentTime > 3) {
    audio.currentTime = 0;
    return;
  }
  const prev = (playIndex - 1 + len) % len;
  loadAndPlay(playQueue[prev], prev);
}

function cycleLoop() {
  const modes = ['off', 'all', 'single'];
  const labels = { off: '🔁 不循环', all: '🔁 列表循环', single: '🔂 单曲循环' };
  const idx = modes.indexOf(loopMode);
  loopMode = modes[(idx + 1) % 3];
  document.getElementById('loopBtn').textContent = labels[loopMode];
  document.getElementById('loopBtn').classList.toggle('active', loopMode !== 'off');
}

function setVolume(v) {
  audio.volume = v / 100;
}

// ============================================
// Progress Bar / Seeking
// ============================================
function updateProgress(pct) {
  document.getElementById('progressFill').style.width = pct + '%';
  document.getElementById('progressThumb').style.left = pct + '%';
}

function formatTime(secs) {
  if (!secs || isNaN(secs)) return '0:00';
  const m = Math.floor(secs / 60);
  const s = Math.floor(secs % 60);
  return `${m}:${s.toString().padStart(2, '0')}`;
}

function getProgressPct(e) {
  const bar = document.getElementById('progressBar');
  const rect = bar.getBoundingClientRect();
  // touchend 时 e.touches 为空，需要用 changedTouches
  let clientX;
  if (e.touches && e.touches.length > 0) {
    clientX = e.touches[0].clientX;
  } else if (e.changedTouches && e.changedTouches.length > 0) {
    clientX = e.changedTouches[0].clientX;
  } else if (e.clientX !== undefined) {
    clientX = e.clientX;
  } else {
    return null;
  }
  let pct = ((clientX - rect.left) / rect.width) * 100;
  return Math.max(0, Math.min(100, pct));
}

function seekTo(pct) {
  if (pct === null || !audio.duration || isNaN(audio.duration)) return;
  audio.currentTime = (pct / 100) * audio.duration;
  updateProgress(pct);
}

// 通过 JS 绑定事件，比内联 onpointerdown/ontouchstart 更可靠
function initProgressBar() {
  const bar = document.getElementById('progressBar');
  if (!bar) return;

  // 点击直接跳转
  bar.addEventListener('click', function(e) {
    e.preventDefault();
    e.stopPropagation();
    const pct = getProgressPct(e);
    if (pct !== null) seekTo(pct);
  });

  // 触摸拖动
  bar.addEventListener('touchstart', function(e) {
    e.preventDefault();
    isSeeking = true;
    bar.classList.add('dragging');
    const pct = getProgressPct(e);
    if (pct !== null) seekTo(pct);  // 手指落下立即跳转
  }, { passive: false });

  bar.addEventListener('touchmove', function(e) {
    if (!isSeeking) return;
    e.preventDefault();
    const pct = getProgressPct(e);
    if (pct !== null) seekTo(pct);  // 拖动时实时跟随
  }, { passive: false });

  bar.addEventListener('touchend', function(e) {
    if (!isSeeking) return;
    isSeeking = false;
    bar.classList.remove('dragging');
    const pct = getProgressPct(e);
    if (pct !== null) seekTo(pct);
  });

  // 鼠标拖动（桌面端兼容）
  bar.addEventListener('mousedown', function(e) {
    e.preventDefault();
    isSeeking = true;
    bar.classList.add('dragging');
    const pct = getProgressPct(e);
    if (pct !== null) updateProgress(pct);
  });
  document.addEventListener('mousemove', function(e) {
    if (!isSeeking) return;
    const pct = getProgressPct(e);
    if (pct !== null) updateProgress(pct);
  });
  document.addEventListener('mouseup', function(e) {
    if (!isSeeking) return;
    isSeeking = false;
    bar.classList.remove('dragging');
    const pct = getProgressPct(e);
    if (pct !== null) seekTo(pct);
  });
}

// ============================================
// Now Playing Screen
// ============================================
function openNowPlaying() {
  if (!audio.src || playIndex < 0) return;
  document.getElementById('nowPlaying').classList.remove('hidden');
  document.body.style.overflow = 'hidden';
}

function closeNowPlaying() {
  document.getElementById('nowPlaying').classList.add('hidden');
  document.body.style.overflow = '';
}

// ============================================
// API Calls
// ============================================
async function fetchAPI(url) {
  const resp = await fetch(url);
  return resp.json();
}

async function loadLibrary() {
  document.getElementById('loadingLib').classList.remove('hidden');
  try {
    const data = await fetchAPI('/api/library');
    if (data.ok) {
      allSongs = data.songs;
      renderTagChips(data.tags);
      renderSongList();
    }
  } catch (e) {
    showToast('加载失败，请检查网络');
  } finally {
    document.getElementById('loadingLib').classList.add('hidden');
  }
}

// ============================================
// Rendering
// ============================================
function renderTagChips(tags) {
  const container = document.getElementById('tagChips');
  let html = `<span class="tag-chip ${currentTag === '' ? 'active' : ''}" data-tag="">全部</span>`;
  for (const t of tags) {
    html += `<span class="tag-chip ${currentTag === t ? 'active' : ''}" data-tag="${escapeHtml(t)}">${escapeHtml(t)}</span>`;
  }
  container.innerHTML = html;
  container.querySelectorAll('.tag-chip').forEach(el => {
    el.addEventListener('click', () => filterByTag(el.dataset.tag));
  });
}

function filterByTag(tag) {
  currentTag = tag;
  renderTagChips([...new Set(allSongs.map(s => s.tag))].sort());
  renderSongList();
}

function getFilteredSongs() {
  if (!currentTag) return allSongs;
  return allSongs.filter(s => s.tag === currentTag);
}

function renderSongList() {
  const container = document.getElementById('songList');
  const songs = getFilteredSongs();
  const currentRelPath = playIndex >= 0 && playQueue[playIndex] ? playQueue[playIndex].rel_path : '';

  if (songs.length === 0) {
    container.innerHTML = `<div class="empty-state"><div class="icon">📭</div><div class="title">暂无歌曲</div><div class="desc">去搜索页搜索下载歌曲吧</div></div>`;
    return;
  }

  let html = '';
  songs.forEach((s, i) => {
    const isNow = s.rel_path === currentRelPath;
    const emojis = ['🎵', '🎶', '🎼', '🎹', '🎸', '🥁'];
    const emoji = emojis[Math.abs(hashCode(s.name)) % emojis.length];
    const cls = isNow ? 'song-item now-playing-item' : 'song-item';
    const artist = s.artist || '';
    const tag = s.tag || '';

    html += `
    <div class="${cls}" data-rel-path="${escapeHtml(s.rel_path)}">
      ${isNow ? '<div class="now-playing-indicator"></div>' : `<span class="song-index">${i + 1}</span>`}
      <div class="song-cover">${emoji}</div>
      <div class="song-info">
        <div class="song-name">${escapeHtml(s.name)}</div>
        <div class="song-meta">${escapeHtml(artist || tag)}${artist && tag ? ' · ' + escapeHtml(tag) : ''} · ${s.size_mb}MB</div>
      </div>
    </div>`;
  });
  container.innerHTML = html;
  container.querySelectorAll('.song-item').forEach(el => {
    const rp = el.dataset.relPath;
    if (rp) el.addEventListener('click', () => playSongByRelPath(rp));
  });
}

function playSongByRelPath(relPath) {
  // Build queue from current filtered list
  const songs = getFilteredSongs();
  playQueue = songs;
  const idx = songs.findIndex(s => s.rel_path === relPath);
  if (idx >= 0) {
    loadAndPlay(songs[idx], idx);
  }
}

// ============================================
// Search
// ============================================
const searchInput = document.getElementById('searchInput');
let searchTimeout = null;

searchInput.addEventListener('input', () => {
  const val = searchInput.value.trim();
  document.getElementById('searchClear').classList.toggle('visible', val.length > 0);
  clearTimeout(searchTimeout);
  if (val) {
    searchTimeout = setTimeout(() => doSearch(val), 300);
  } else {
    document.getElementById('searchResults').innerHTML = '';
  }
});

function clearSearch() {
  searchInput.value = '';
  document.getElementById('searchClear').classList.remove('visible');
  document.getElementById('searchResults').innerHTML = '';
}

async function doSearch(keyword) {
  document.getElementById('searchResults').innerHTML = '<div class="loading"><div class="spinner"></div>搜索中...</div>';
  try {
    const data = await fetchAPI(`/api/search-all?q=${encodeURIComponent(keyword)}`);
    if (data.ok && data.local && data.local.length > 0) {
      renderSearchResults(data.local);
    } else {
      document.getElementById('searchResults').innerHTML = '<div class="empty-state"><div class="icon">🔍</div><div class="title">未找到相关歌曲</div></div>';
    }
  } catch (e) {
    document.getElementById('searchResults').innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><div class="title">搜索失败</div></div>';
  }
}

function renderSearchResults(results) {
  const currentRelPath = playIndex >= 0 && playQueue[playIndex] ? playQueue[playIndex].rel_path : '';
  let html = '';
  results.forEach((r, i) => {
    const isNow = r.rel_path === currentRelPath;
    const cls = isNow ? 'song-item now-playing-item' : 'song-item';
    html += `
    <div class="${cls}" data-rel-path="${escapeHtml(r.rel_path)}" data-title="${escapeHtml(r.title)}">
      ${isNow ? '<div class="now-playing-indicator"></div>' : `<span class="song-index">${i + 1}</span>`}
      <div class="song-cover">🎵</div>
      <div class="song-info">
        <div class="song-name">${escapeHtml(r.title)}</div>
        <div class="song-meta">${escapeHtml(r.tag || '')} · ${r.size_mb || 0}MB</div>
      </div>
    </div>`;
  });
  const container = document.getElementById('searchResults');
  container.innerHTML = html;
  container.querySelectorAll('.song-item').forEach(el => {
    const rp = el.dataset.relPath;
    if (rp) el.addEventListener('click', () => playSongFromSearch(rp, el.dataset.title));
  });
}

function playSongFromSearch(relPath, title) {
  // Find the song in allSongs
  const song = allSongs.find(s => s.rel_path === relPath);
  if (song) {
    playQueue = [song];
    loadAndPlay(song, 0);
  }
}

// ============================================
// Favorites Tab
// ============================================
function renderFavList() {
  const container = document.getElementById('favList');
  const favs = allSongs.filter(s => s.rating >= 2);
  if (favs.length === 0) {
    container.innerHTML = '<div class="empty-state"><div class="icon">💜</div><div class="title">还没有收藏歌曲</div><div class="desc">给喜欢的歌曲评分2-3星即可</div></div>';
    return;
  }

  const currentRelPath = playIndex >= 0 && playQueue[playIndex] ? playQueue[playIndex].rel_path : '';
  let html = '';
  favs.forEach((s, i) => {
    const isNow = s.rel_path === currentRelPath;
    const cls = isNow ? 'song-item now-playing-item' : 'song-item';
    const artist = s.artist || '';
    html += `
    <div class="${cls}" data-rel-path="${escapeHtml(s.rel_path)}" data-idx="${i}">
      ${isNow ? '<div class="now-playing-indicator"></div>' : `<span class="song-index">${i + 1}</span>`}
      <div class="song-cover">⭐</div>
      <div class="song-info">
        <div class="song-name">${escapeHtml(s.name)}</div>
        <div class="song-meta">${escapeHtml(artist)} · ${'⭐'.repeat(s.rating)}</div>
      </div>
    </div>`;
  });
  container.innerHTML = html;
  container.querySelectorAll('.song-item').forEach(el => {
    const rp = el.dataset.relPath;
    if (rp) el.addEventListener('click', () => playFav(rp, parseInt(el.dataset.idx) || 0));
  });

  // Store favs as queue for playback
  window._favQueue = favs;
}

function playFav(relPath, idx) {
  if (!window._favQueue) return;
  playQueue = window._favQueue;
  loadAndPlay(window._favQueue[idx], idx);
}

// ============================================
// Tab Switching
// ============================================
function switchTab(tab) {
  document.querySelectorAll('.tab-item').forEach(el => el.classList.remove('active'));
  document.querySelector(`.tab-item[data-tab="${tab}"]`)?.classList.add('active');

  document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
  const target = document.getElementById('tab-' + tab);
  if (target) target.classList.remove('hidden');

  if (tab === 'fav') renderFavList();
}



// ============================================
// Keyboard shortcuts (for desktop testing)
// ============================================
document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  if (e.code === 'ArrowLeft') { audio.currentTime = Math.max(0, audio.currentTime - 5); }
  if (e.code === 'ArrowRight') { audio.currentTime = Math.min(audio.duration || 0, audio.currentTime + 5); }
});

// ============================================
// Utilities
// ============================================
function escapeHtml(str) {
  if (!str) return '';
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function hashCode(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    hash = ((hash << 5) - hash) + str.charCodeAt(i);
    hash |= 0;
  }
  return Math.abs(hash);
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(el._timeout);
  el._timeout = setTimeout(() => el.classList.remove('show'), 2000);
}

function refreshLibrary() {
  loadLibrary().then(() => showToast('曲库已刷新'));
}

// ============================================
// Auth check - redirect to login if not authenticated
// ============================================
async function checkAuth() {
  try {
    const resp = await fetch('/api/ping');
    const data = await resp.json();
    if (data.need_auth) {
      window.location.href = '/login';
    }
    // 显示当前角色：只读 or 管理员
    if (data.role === 'readonly') {
      document.getElementById('roleBadge').classList.remove('hidden');
      document.getElementById('roleBadge').textContent = '📱 只读模式';
    }
  } catch (e) {
    // Server might be down, do nothing
  }
}
checkAuth();

// ============================================
// Keep server alive (ping every 45s)
// ============================================
setInterval(() => {
  fetch('/api/ping').catch(() => {});
}, 45000);

// ============================================
// PWA: Register Service Worker
// ============================================
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}

// ============================================
// Init
// ============================================
loadLibrary();
setVolume(70);
initProgressBar();
</script>
