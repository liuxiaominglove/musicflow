<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MusicFlow</title>
<style>
/* ============================================
   全局样式 - 暗色主题（参考QQ音乐/酷狗风格）
   ============================================ */
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --bg-primary: #121212;
  --bg-secondary: #1a1a2e;
  --bg-card: #1e1e32;
  --bg-hover: #252540;
  --text-primary: #e0e0e0;
  --text-secondary: #a0a0b8;
  --text-muted: #606078;
  --accent: #ff4757;
  --accent-light: #ff6b81;
  --accent-gradient: linear-gradient(135deg, #ff4757, #ff6b81);
  --gold: #ffc048;
  --green: #2ed573;
  --border: #2a2a40;
  --radius: 10px;
  --shadow: 0 4px 20px rgba(0,0,0,0.3);
  --player-height: 80px;
  --sidebar-width: 200px;
  --topbar-height: 56px;
  --float-player-height: 38px;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "Microsoft YaHei", sans-serif;
  background: var(--bg-primary);
  color: var(--text-primary);
  height: 100vh;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  -webkit-app-region: no-drag;
}

/* ============================================
   顶部导航栏
   ============================================ */
.topbar {
  height: var(--topbar-height);
  background: var(--bg-secondary);
  display: flex;
  align-items: center;
  padding: 0 24px;
  border-bottom: 1px solid var(--border);
  z-index: 100;
  gap: 16px;
  flex-shrink: 0;
  -webkit-app-region: drag;
  -webkit-user-select: none;
  user-select: none;
}

.logo {
  font-size: 20px;
  font-weight: 700;
  background: var(--accent-gradient);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  white-space: nowrap;
  margin-right: 8px;
}

.search-box {
  flex: 1;
  max-width: 480px;
  position: relative;
}

.search-box input {
  width: 100%;
  height: 36px;
  padding: 0 40px 0 16px;
  border: 1px solid var(--border);
  border-radius: 18px;
  background: var(--bg-card);
  color: var(--text-primary);
  font-size: 14px;
  outline: none;
  transition: all 0.3s;
}

.search-box input:focus {
  border-color: var(--accent);
  background: var(--bg-hover);
}

.search-box button {
  position: absolute;
  right: 4px;
  top: 4px;
  width: 28px;
  height: 28px;
  border: none;
  border-radius: 50%;
  background: var(--accent-gradient);
  color: #fff;
  cursor: pointer;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: transform 0.2s;
}

.search-box button:hover { transform: scale(1.1); }

.nav-actions { display: flex; gap: 8px; align-items: center; }
.nav-actions button {
  padding: 6px 14px;
  border: 1px solid var(--border);
  border-radius: 16px;
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  font-size: 13px;
  transition: all 0.2s;
  white-space: nowrap;
}
.nav-actions button:hover { background: var(--bg-hover); color: var(--text-primary); }
.nav-actions button.active { background: var(--accent-gradient); color: #fff; border-color: transparent; }
.nav-actions button.desktop-only-btn {
  color: var(--green);
  border-color: rgba(46,213,115,0.3);
}
.nav-actions button.desktop-only-btn:hover {
  background: rgba(46,213,115,0.1);
  border-color: var(--green);
}
.nav-actions button.desktop-only-btn.off {
  color: var(--text-muted);
  border-color: var(--border);
}

/* ============================================
   主体布局
   ============================================ */
.main-container {
  display: flex;
  flex: 1;
  overflow: hidden;
  padding-bottom: var(--player-height);
}

/* ---- 左侧边栏 ---- */
.sidebar {
  width: var(--sidebar-width);
  background: var(--bg-secondary);
  padding: 16px 0;
  border-right: 1px solid var(--border);
  overflow-y: auto;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.sidebar-section {
  padding: 8px 16px 4px;
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
  font-weight: 600;
}

.sidebar-item {
  padding: 10px 16px;
  margin: 0 8px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  color: var(--text-secondary);
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 10px;
}

.sidebar-item:hover { background: var(--bg-hover); color: var(--text-primary); }
.sidebar-item.active { background: var(--accent); color: #fff; }
.sidebar-item .icon { font-size: 16px; width: 20px; text-align: center; }
.sidebar-item .count { margin-left: auto; font-size: 12px; opacity: 0.6; }

/* ---- 主内容区 ---- */
.content {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
}

.content-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}

.content-title {
  font-size: 22px;
  font-weight: 700;
}

.content-count {
  font-size: 13px;
  color: var(--text-muted);
}

/* ---- 搜索结果浮层 ---- */
.search-results-overlay {
  position: fixed;
  top: var(--topbar-height);
  left: 0;
  right: 0;
  bottom: var(--player-height);
  background: rgba(0,0,0,0.85);
  z-index: 200;
  padding: 24px;
  overflow-y: auto;
  display: none;
}

.search-results-overlay.show { display: block; }

.search-results-overlay .close-btn {
  position: absolute;
  top: 16px;
  right: 24px;
  font-size: 28px;
  cursor: pointer;
  color: var(--text-secondary);
  width: 36px;
  height: 36px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: var(--bg-card);
}
.search-results-overlay .close-btn:hover { color: var(--accent); }

/* ---- 搜索工具栏（来源/音质/标签） ---- */
.search-toolbar {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 10px 16px;
  margin: 0 auto;
  max-width: 1100px;
  background: var(--bg-card);
  border-radius: var(--radius);
  border: 1px solid var(--border);
}
.search-toolbar .tb-item {
  display: flex;
  align-items: center;
  gap: 6px;
}
.search-toolbar .tb-item label {
  font-size: 12px;
  color: var(--text-muted);
  white-space: nowrap;
}
.search-toolbar .tb-item select {
  padding: 5px 8px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--bg-input);
  color: var(--text-primary);
  font-size: 12px;
  cursor: pointer;
  outline: none;
  min-width: 90px;
}
.search-toolbar .tb-item select:focus {
  border-color: var(--accent);
}
.search-toolbar .tb-divider {
  flex: 1;
}

.search-results-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 12px;
  max-width: 1100px;
  margin: 40px auto 0;
}

.search-result-card {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 12px 16px;
  background: var(--bg-card);
  border-radius: var(--radius);
  cursor: pointer;
  transition: all 0.2s;
  border: 1px solid transparent;
}

.search-result-card:hover {
  background: var(--bg-hover);
  border-color: var(--accent);
}

.result-thumb {
  width: 48px;
  height: 48px;
  border-radius: 6px;
  object-fit: cover;
  background: var(--bg-hover);
  flex-shrink: 0;
}

.result-info { flex: 1; min-width: 0; }
.result-title { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.result-meta { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

.result-actions { display: flex; gap: 6px; flex-shrink: 0; }
.result-actions button {
  padding: 6px 12px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  transition: all 0.2s;
  white-space: nowrap;
}
.btn-download {
  background: var(--bg-hover);
  color: var(--text-secondary);
}
.btn-download:hover { background: var(--green); color: #000; }
.btn-play {
  background: var(--accent-gradient);
  color: #fff;
}
.btn-play:hover { opacity: 0.85; }
.btn-download.loading { opacity: 0.5; pointer-events: none; }

/* ---- 播放按钮 ---- */
.song-play-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  padding: 4px 8px;
  font-size: 14px;
  border-radius: 4px;
  opacity: 0;
  transition: all 0.15s;
  flex-shrink: 0;
}
.song-item:hover .song-play-btn { opacity: 1; }
.song-play-btn:hover { background: var(--bg-hover); color: var(--accent-light); transform: scale(1.2); }

/* ---- 重命名按钮 ---- */
.song-rename-btn {
  background: transparent;
  border: none;
  color: var(--text-muted);
  cursor: pointer;
  padding: 2px 6px;
  font-size: 12px;
  border-radius: 4px;
  opacity: 0;
  transition: all 0.15s;
  flex-shrink: 0;
}
.song-item:hover .song-rename-btn { opacity: 1; }
.song-rename-btn:hover { background: var(--bg-hover); color: var(--accent-light); }

/* ---- 右键菜单 ---- */
.context-menu {
  position: fixed;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 4px 0;
  min-width: 160px;
  z-index: 1000;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  display: none;
}
.context-menu.show { display: block; }
.context-menu-item {
  padding: 10px 16px;
  cursor: pointer;
  font-size: 13px;
  color: var(--text-primary);
  transition: all 0.15s;
  display: flex;
  align-items: center;
  gap: 8px;
}
.context-menu-item:hover { background: var(--bg-hover); }
.context-menu-item.danger { color: var(--accent); }
.context-menu-item.danger:hover { background: rgba(255,71,87,0.15); }
.context-menu-divider {
  height: 1px;
  background: var(--border);
  margin: 4px 0;
}
.context-menu-item.context-menu-has-sub {
  position: relative;
}
.context-submenu {
  position: absolute;
  left: 100%;
  top: 0;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 4px 0;
  min-width: 140px;
  max-height: 240px;
  overflow-y: auto;
  box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  display: none;
  z-index: 1001;
}
.context-menu-has-sub:hover .context-submenu,
.context-submenu:hover {
  display: block;
}
.context-submenu .submenu-item {
  padding: 8px 14px;
  cursor: pointer;
  font-size: 12px;
  color: var(--text-primary);
  transition: all 0.15s;
  white-space: nowrap;
}
.context-submenu .submenu-item:hover {
  background: var(--bg-hover);
}
.context-submenu .submenu-new-tag {
  border-top: 1px solid var(--border);
  margin-top: 4px;
  padding-top: 4px;
}
.context-submenu .submenu-new-tag input {
  width: 100%;
  padding: 6px 8px;
  border: none;
  background: transparent;
  color: var(--accent-light);
  font-size: 12px;
  outline: none;
}
.context-submenu .submenu-new-tag input::placeholder {
  color: var(--text-muted);
}

/* ---- 上一首/下一首按钮 ---- */
.player-btn.prev-next-btn {
  width: 32px;
  height: 32px;
  font-size: 14px;
  border-radius: 8px;
  background: var(--bg-hover);
}
.player-btn.prev-next-btn:hover {
  background: var(--accent-gradient);
  color: #fff;
  transform: scale(1.1);
}

.search-result-card .btn-download {
  background: var(--bg-hover);
  color: var(--text-secondary);
  border: none;
  padding: 6px 12px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 12px;
  transition: all 0.2s;
}
.search-result-card .btn-download:hover { background: var(--green); color: #000; }

/* ---- 行内重命名编辑框 ---- */
.song-rename-input {
  background: var(--bg-raised);
  border: 1px solid var(--accent);
  border-radius: 6px;
  color: var(--text-primary);
  padding: 4px 8px;
  font-size: 14px;
  width: 100%;
  max-width: 400px;
  outline: none;
}

/* ---- 审核模式 ---- */
.review-banner {
  display: none;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  margin: 0 16px 8px;
  background: linear-gradient(135deg, rgba(241, 196, 15, 0.12), rgba(243, 156, 18, 0.06));
  border: 1px solid rgba(241, 196, 15, 0.3);
  border-radius: 10px;
  font-size: 13px;
  color: var(--text-secondary);
}
body.review-mode .review-banner { display: flex; }

.song-review-row {
  display: flex;
  align-items: center;
  gap: 8px;
  flex: 1;
  min-width: 0;
}
.song-review-input {
  background: var(--bg-raised);
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text-primary);
  padding: 4px 10px;
  font-size: 13px;
  outline: none;
  transition: border-color 0.2s;
  flex: 1;
  min-width: 80px;
}
.song-review-input:focus { border-color: var(--accent); }
.song-review-artist { max-width: 160px; }
.song-review-btn {
  padding: 5px 12px;
  border: none;
  border-radius: 6px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s;
  white-space: nowrap;
  flex-shrink: 0;
}
.song-review-confirm {
  background: var(--accent-gradient);
  color: #fff;
}
.song-review-confirm:hover { filter: brightness(1.1); }
.song-review-skip {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-muted);
}
.song-review-skip:hover { background: var(--bg-hover); color: var(--text-primary); }

.song-review-search {
  background: rgba(52, 152, 219, 0.15);
  border: 1px solid rgba(52, 152, 219, 0.3);
  color: #3498db;
}
.song-review-search:hover { background: rgba(52, 152, 219, 0.25); }
.song-review-search.loading { opacity: 0.6; pointer-events: none; }

.song-review-shazam {
  background: rgba(0, 210, 255, 0.12);
  border: 1px solid rgba(0, 210, 255, 0.3);
  color: #00d2ff;
}
.song-review-shazam:hover { background: rgba(0, 210, 255, 0.25); box-shadow: 0 0 8px rgba(0,210,255,0.15); }
.song-review-shazam.loading { opacity: 0.6; pointer-events: none; animation: shazam-pulse 1s infinite; }
@keyframes shazam-pulse {
  0%,100% { box-shadow: 0 0 4px rgba(0,210,255,0.2); }
  50% { box-shadow: 0 0 16px rgba(0,210,255,0.5); }
}

.search-results {
  display: none;
  position: absolute;
  left: 0;
  right: 0;
  top: 100%;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.5);
  z-index: 100;
  max-height: 240px;
  overflow-y: auto;
  margin-top: 6px;
}
.search-results.show { display: block; }

.search-result-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 14px;
  cursor: pointer;
  transition: background 0.12s;
  border-bottom: 1px solid var(--border);
}
.search-result-item:last-child { border-bottom: none; }
.search-result-item:hover { background: var(--bg-hover); }

.search-result-info {
  flex: 1;
  min-width: 0;
}
.search-result-name {
  font-size: 13px;
  font-weight: 500;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.search-result-artist {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 2px;
}
.search-result-pick {
  background: var(--accent-gradient);
  color: #fff;
  border: none;
  border-radius: 4px;
  padding: 4px 10px;
  font-size: 11px;
  cursor: pointer;
  margin-left: 10px;
  flex-shrink: 0;
}
.search-result-pick:hover { filter: brightness(1.1); }

.search-no-result {
  padding: 20px;
  text-align: center;
  color: var(--text-muted);
  font-size: 13px;
}

/* ---- 歌曲列表 ---- */
.song-list { }

.song-item {
  display: flex;
  align-items: center;
  padding: 10px 16px;
  border-radius: var(--radius);
  cursor: pointer;
  transition: all 0.15s;
  gap: 14px;
  margin-bottom: 2px;
}

.song-item:hover { background: var(--bg-hover); }
.song-item.playing {
  background: linear-gradient(135deg, rgba(255,71,87,0.15), rgba(255,107,129,0.05));
}
.song-item.playing .song-index { color: var(--accent); }
.song-item.playing .song-name { color: var(--accent-light); }

.song-index {
  width: 28px;
  text-align: center;
  font-size: 15px;
  color: var(--text-muted);
  flex-shrink: 0;
}

.song-cover {
  width: 40px;
  height: 40px;
  border-radius: 6px;
  background: var(--bg-hover);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  flex-shrink: 0;
}

.song-info {
  flex: 1;
  min-width: 0;
}

.song-name {
  font-size: 14px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.song-verified {
  display: inline-block;
  width: 18px;
  height: 18px;
  line-height: 18px;
  text-align: center;
  background: rgba(46, 204, 113, 0.15);
  color: #2ecc71;
  border-radius: 50%;
  font-size: 11px;
  font-weight: 700;
  margin-right: 5px;
  flex-shrink: 0;
  cursor: default;
}

.song-artist {
  font-size: 12px;
  color: var(--accent-light);
  margin-top: 1px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.song-tag {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 2px;
}

.song-rating {
  display: flex;
  gap: 3px;
  flex-shrink: 0;
}

.star {
  cursor: pointer;
  font-size: 18px;
  color: var(--border);
  transition: all 0.15s;
  user-select: none;
}

.star:hover { transform: scale(1.2); }
.star.active { color: var(--gold); }
.star.active:hover { color: #ffa502; }

.song-duration {
  font-size: 12px;
  color: var(--text-muted);
  width: 42px;
  text-align: right;
  flex-shrink: 0;
}

.song-size {
  font-size: 11px;
  color: var(--text-muted);
  width: 48px;
  text-align: right;
  flex-shrink: 0;
}

/* ---- 空状态 ---- */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 80px 20px;
  color: var(--text-muted);
}

.empty-state .icon { font-size: 60px; margin-bottom: 16px; }
.empty-state .text { font-size: 16px; margin-bottom: 8px; }
.empty-state .hint { font-size: 13px; }

.search-result-card {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 12px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  margin-bottom: 6px;
  transition: all 0.15s;
}
.search-result-card:hover { border-color: var(--accent); }
.search-result-card .result-thumb {
  width: 36px; height: 36px;
  border-radius: 4px;
  object-fit: cover;
  flex-shrink: 0;
  background: var(--bg-hover);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
}
.search-result-card .result-info { flex: 1; min-width: 0; }
.search-result-card .result-name {
  font-size: 13px; font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.search-result-card .result-artist {
  font-size: 11px; color: var(--text-muted); margin-top: 2px;
}
.search-result-card .result-actions { display: flex; gap: 6px; flex-shrink: 0; }
.btn-download {
  background: var(--bg-hover);
  color: var(--text-secondary); border: none;
  padding: 6px 14px; border-radius: 6px;
  cursor: pointer; font-size: 12px;
  transition: all 0.2s;
}
.btn-download:hover { background: var(--green); color: #000; }
.btn-download:disabled { opacity: 0.5; cursor: not-allowed; }
.online-loading { text-align: center; padding: 20px; color: var(--text-muted); }
.online-error { text-align: center; padding: 12px; color: var(--accent); font-size: 13px; }

/* ---- 加载动画 ---- */
.spinner {
  width: 20px; height: 20px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
  display: inline-block;
}

@keyframes spin { to { transform: rotate(360deg); } }

/* ============================================
   底部播放器
   ============================================ */
.player-bar {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: var(--player-height);
  background: var(--bg-secondary);
  border-top: 1px solid var(--border);

  align-items: center;
  padding: 0 24px;
  gap: 20px;

  min-width: 0;
}

  text-overflow: ellipsis;
}

/* 循环模式按钮 */
.loop-btn-group {

  align-items: center;
  gap: 6px;
}
.player-btn.loop-btn {

  height: 38px;
  font-size: 18px;

}

  border-color: var(--accent-light);
  background: linear-gradient(135deg, rgba(59, 130, 246, 0.25), rgba(139, 92, 246, 0.25));

/* 循环状态标签 */
.loop-status-tag {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 10px;
  background: var(--bg-hover);
  color: var(--text-secondary);
  white-space: nowrap;
}

.player-btn {
  width: 36px;
  height: 36px;
  border: none;
  border-radius: 50%;
  cursor: pointer;
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  background: transparent;
  color: var(--text-primary);
}

.player-btn:hover { color: var(--accent-light); }
.player-btn.play-btn {
  width: 44px;
  height: 44px;
  background: var(--accent-gradient);
  color: #fff;
  font-size: 18px;
}
.player-btn.play-btn:hover { opacity: 0.85; transform: scale(1.05); }

.player-progress {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 10px;
}

.player-time {
  font-size: 11px;
  color: var(--text-muted);
  width: 36px;
  text-align: center;
  flex-shrink: 0;
}

.progress-bar {
  flex: 1;
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  cursor: pointer;
  position: relative;
  transition: height 0.15s;
}

.progress-bar:hover { height: 6px; }

.progress-fill {
  height: 100%;
  background: var(--accent-gradient);
  border-radius: 2px;
  transition: width 0.1s linear;
  position: relative;
}

.progress-bar:hover .progress-fill::after {
  content: '';
  position: absolute;
  right: -6px;
  top: 50%;
  transform: translateY(-50%);
  width: 12px;
  height: 12px;
  background: var(--accent-light);
  border-radius: 50%;
  box-shadow: 0 0 6px rgba(59, 130, 246, 0.5);
}

.player-volume {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
  width: 140px;
}

.player-volume .vol-icon {
  font-size: 18px;
  cursor: pointer;
  color: var(--text-secondary);
}

.player-volume input[type="range"] {
  width: 80px;
  height: 4px;
  -webkit-appearance: none;
  background: var(--border);
  border-radius: 2px;
  outline: none;
}

.player-volume input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 12px;
  height: 12px;
  border-radius: 50%;
  background: var(--accent);
  cursor: pointer;
}

/* ---- 下载进度弹窗 ---- */
.toast {
  position: fixed;
  top: 70px;
  left: 50%;
  transform: translateX(-50%);
  padding: 10px 24px;
  border-radius: 20px;
  font-size: 14px;
  z-index: 500;
  animation: toastIn 0.3s ease;
  pointer-events: none;
}

.toast.success { background: var(--green); color: #000; }
.toast.error { background: var(--accent); color: #fff; }
.toast.info { background: var(--bg-card); color: var(--text-primary); border: 1px solid var(--border); }

@keyframes toastIn {
  from { opacity: 0; transform: translateX(-50%) translateY(-10px); }
  to { opacity: 1; transform: translateX(-50%) translateY(0); }
}

/* 响应式 */
@media (max-width: 768px) {
  .sidebar { display: none; }
  .player-info { width: 120px; }
  .player-volume { display: none; }
  .song-size { display: none; }
}

/* ============================================
   定时播放面板（右侧抽屉）
   ============================================ */
.schedule-panel {
  position: fixed;
  top: 0; right: -420px;

.schedule-panel-header {

}
.schedule-panel-header h3 {

  font-weight: 600;

}
.schedule-panel-header .close-panel {

  font-size: 16px;
  display: flex;
  align-items: center;

}
.schedule-panel-header .close-panel:hover { background: var(--accent); color: #fff; }

.schedule-form {
  padding: 16px 20px;

}
.schedule-form-row {
  display: flex;

  align-items: flex-end;
  margin-bottom: 10px;
}
.schedule-form-row:last-child { margin-bottom: 0; }

.schedule-form-group {
  display: flex;
  flex-direction: column;
  gap: 4px;
}
.schedule-form-group label {
  font-size: 11px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.schedule-form-group input,
.schedule-form-group select {
  height: 36px;
  padding: 0 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg-card);

  font-size: 14px;
  outline: none;
  transition: border-color 0.2s;
}
.schedule-form-group input:focus,
.schedule-form-group select:focus {
  border-color: var(--accent);
}
.schedule-form-group input[type="time"] { width: 110px; }
.schedule-form-group select { min-width: 200px; flex: 1; }

/* 筛选控件缩小宽度 */
.schedule-filter-group { flex: 1; min-width: 0; }
.schedule-filter-group select { min-width: 0; }

.btn-add-schedule {
  height: 36px;
  padding: 0 16px;
  border: none;
  border-radius: 8px;
  background: var(--accent-gradient);
  color: #fff;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
  flex-shrink: 0;
  align-self: flex-end;
}
.btn-add-schedule:hover { opacity: 0.85; transform: scale(1.02); }

/* 取消编辑按钮 */
.btn-cancel-schedule {
  height: 36px;
  padding: 0 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg-card);
  color: var(--text-secondary);
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
  align-self: flex-end;
  transition: all 0.2s;
}
.btn-cancel-schedule:hover { border-color: var(--accent); color: var(--text-primary); }

/* 定时面板搜索框 */
.schedule-search-input {
  width: 100%;
  height: 36px;
  padding: 0 12px 0 36px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg-card);
  color: var(--text-primary);
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s;
}
.schedule-search-input:focus { border-color: var(--accent); }

/* 编辑按钮 */
.schedule-edit {
  width: 28px; height: 28px;
  border: none; border-radius: 6px;
  background: rgba(106, 76, 224, 0.1);
  color: var(--accent);
  font-size: 13px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
}
.schedule-edit:hover { background: rgba(106, 76, 224, 0.2); }

.schedule-list {
  flex: 1;
  overflow-y: auto;
  padding: 8px 0;
}
.schedule-list-header {
  padding: 10px 20px 6px;
  font-size: 12px;
  color: var(--text-muted);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}
.schedule-item {
  display: flex;
  align-items: center;
  padding: 12px 20px;
  gap: 12px;
  transition: background 0.2s;
  border-bottom: 1px solid rgba(255,255,255,0.03);
}
.schedule-item:hover { background: var(--bg-hover); }
.schedule-item.disabled { opacity: 0.4; }

.schedule-time {
  font-size: 22px;
  font-weight: 700;
  color: var(--accent-light);
  min-width: 70px;
  font-variant-numeric: tabular-nums;
}
.schedule-item.disabled .schedule-time { color: var(--text-muted); }

.schedule-song-info {
  flex: 1;
  min-width: 0;
}
.schedule-song-name {
  font-size: 13px;
  font-weight: 500;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.schedule-song-meta {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 2px;
}

.schedule-toggle {
  width: 40px; height: 22px;
  border-radius: 11px;
  border: none;
  cursor: pointer;
  background: var(--border);
  position: relative;
  transition: all 0.2s;
  flex-shrink: 0;
}
.schedule-toggle::after {
  content: '';
  position: absolute;
  top: 2px; left: 2px;
  width: 18px; height: 18px;
  border-radius: 50%;
  background: #fff;
  transition: all 0.2s;
}
.schedule-toggle.on { background: var(--green); }
.schedule-toggle.on::after { left: 20px; }

.schedule-delete {
  width: 28px; height: 28px;
  border: none; border-radius: 50%;
  background: transparent;
  color: var(--text-muted);
  cursor: pointer;
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
}
.schedule-delete:hover { background: var(--accent); color: #fff; }

.schedule-empty {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-muted);
  font-size: 14px;
  line-height: 1.8;
}

/* 遮罩 */
.schedule-overlay {
  position: fixed;
  top: 0; left: 0;
  width: 100vw; height: 100vh;

  z-index: 399;
  display: none;
  transition: opacity 0.3s;
}
.schedule-overlay.show { display: block; }

/* ============================================
   窗口拖拽区域 (Electron hiddenInset)
   - 整个 topbar 都是拖拽区域
   - 仅按钮、输入框等交互元素阻止拖拽
   ============================================ */
.topbar {
  -webkit-app-region: drag;
  -webkit-user-select: none;
  user-select: none;
}
/* macOS hiddenInset: 给红绿灯留空间 */
body.is-darwin .topbar {
  padding-left: 80px;
}
/* 顶部栏内交互元素禁止拖拽 */
.topbar button,
.topbar input,
.topbar select {
  -webkit-app-region: no-drag;
}
/* 搜索输入框恢复文本选择 */
.topbar .search-box input {
  -webkit-user-select: text;
  user-select: text;
}
/* 主内容区域禁止拖拽 */
.main-content, .song-list, .schedule-panel, .library-controls,
.playback-bar, .floating-player, .playlist-panel, .schedule-overlay,
.search-results, .tab-bar {
  -webkit-app-region: no-drag;
}
/* 所有交互元素禁止拖拽 */
button, input, select, textarea, a {
  -webkit-app-region: no-drag;
}

/* ============================================
   浮动迷你播放器 (定时播放/后台播放提示)
   ============================================ */
.floating-player {
  position: fixed;
  top: 60px;
  right: 8px;
  left: auto;
  transform: none;
  height: var(--float-player-height);
  min-width: 200px;

  gap: 6px;
  z-index: 1000;
  box-shadow: 0 4px 20px rgba(255,71,87,0.2), 0 2px 6px rgba(0,0,0,0.4);

  -webkit-app-region: no-drag;
  cursor: grab;
}

.floating-player.dragging {

}

.floating-player-icon {

  border-radius: 50%;

@keyframes floatPulse {

}

.floating-player-info {

  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 1px;
  overflow: hidden;
}

.floating-player-name {
  font-size: 11px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;

}

.floating-player-tag {

  color: var(--accent-light);
}

.floating-player-actions {
  display: flex;
  gap: 4px;
  flex-shrink: 0;
}

.floating-player-actions button {
  width: 28px;
  height: 28px;
  border: 1px solid var(--border);
  border-radius: 50%;
  background: var(--bg-hover);
  color: var(--text-primary);

  font-size: 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}

.floating-player-actions button:hover {

}

.floating-player-actions button.floating-play-btn {

  background: var(--accent-gradient);

}

.floating-player-actions button.floating-play-btn:hover {

}

.floating-player-actions button.floating-stop-btn {

  font-size: 12px;

}

</style>

<!-- ===== 顶部导航 ===== -->
<div class="topbar">

<div class="schedule-overlay" id="scheduleOverlay" onclick="toggleSchedulePanel()"></div>

<!-- ===== 定时播放面板（右侧抽屉） ===== -->
<div class="schedule-panel" id="schedulePanel">
  <div class="schedule-panel-header">
    <h3>⏰ 定时播放</h3>
    <button class="close-panel" onclick="toggleSchedulePanel()">✕</button>
  </div>

  <!-- 添加区域 -->
  <div class="schedule-form">
    <div class="schedule-search-row" style="margin-bottom:10px;position:relative;">
      <input type="text" id="scheduleSearchInput" class="schedule-search-input"
             placeholder="🔍 搜索歌曲名称..."
             oninput="onScheduleFilterChange()"
             onkeydown="if(event.key==='Enter'){event.preventDefault();handleScheduleSearchEnter();}">
      <span id="scheduleSearchHint" style="display:none;font-size:11px;color:var(--accent-light);margin-top:4px;min-height:16px;"></span>
    </div>
    <div class="schedule-form-row">
      <div class="schedule-form-group" style="width:120px;flex-shrink:0;">
        <label>播放时间</label>
        <input type="time" id="scheduleTime" placeholder="HH:MM" style="width:100%;">
      </div>
      <div class="schedule-form-group schedule-filter-group">
        <label>标签分类</label>
        <select id="scheduleTagFilter" onchange="onScheduleFilterChange()" style="width:100%;">
          <option value="">全部标签</option>
        </select>
      </div>
      <div class="schedule-form-group schedule-filter-group">
        <label>喜欢程度</label>
        <select id="scheduleRatingFilter" onchange="onScheduleFilterChange()" style="width:100%;">
          <option value="">全部喜欢程度</option>
          <option value="3">⭐⭐⭐ 非常喜欢</option>
          <option value="2">⭐⭐ 喜欢</option>
          <option value="1">⭐ 一般</option>
          <option value="0">未评分</option>
        </select>
      </div>
    </div>
    <div class="schedule-form-row">
      <div class="schedule-form-group" style="flex:1;">
        <label>选择歌曲</label>
        <select id="scheduleSong" style="width:100%;">
          <option value="">-- 请选择歌曲 --</option>
        </select>
      </div>
      <button class="btn-add-schedule" onclick="addSchedule()">💾 保存任务</button>
      <button class="btn-cancel-schedule" id="btnCancelSchedule" onclick="resetScheduleForm()" style="display:none;">取消</button>
    </div>
  </div>

  <!-- 列表区域 -->
  <div class="schedule-list-header">已设定的定时任务</div>
  <div class="schedule-list" id="scheduleList">
    <div class="schedule-empty">还没有定时任务<br>在上面添加一个吧</div>
  </div>
</div>

<!-- ===== 底部播放器 ===== -->
<div class="player-bar" id="playerBar">
  <div class="player-info">
    <div class="player-song-name" id="nowPlaying">未在播放</div>
    <div class="player-artist" id="nowArtist"></div>
    <div class="player-song-tag" id="nowTag"></div>
  </div>
  <div class="player-controls">
    <div class="loop-btn-group">
      <button class="player-btn loop-btn" id="btnLoopAll" onclick="setLoopMode('all')" title="列表循环">🔁</button>
      <button class="player-btn loop-btn" id="btnLoopSingle" onclick="setLoopMode('single')" title="单曲循环">🔂</button>
    </div>
    <span class="loop-status-tag" id="loopStatusTag">📋 列表循环</span>
    <button class="player-btn prev-next-btn" onclick="playPrev()" title="上一首">⏮</button>
    <button class="player-btn play-btn" id="btnPlay" onclick="togglePlay()" title="播放/暂停">▶</button>
    <button class="player-btn prev-next-btn" onclick="playNext()" title="下一首">⏭</button>
  </div>
  <div class="player-progress">
    <span class="player-time" id="currentTime">0:00</span>
    <div class="progress-bar" id="progressBar"
         onmousedown="seekStart(event)"
         onmousemove="seekDrag(event)"
         onmouseup="seekEnd(event)"
         onmouseleave="seekEnd(event)">
      <div class="progress-fill" id="progressFill" style="width:0%"></div>
    </div>
    <span class="player-time" id="totalTime">0:00</span>
  </div>
  <div class="player-volume">
    <span class="vol-icon" onclick="toggleMute()">🔊</span>
    <input type="range" min="0" max="100" value="70" id="volumeSlider" oninput="setVolume(this.value)">
  </div>
</div>

<!-- ===== Toast ===== -->
<div class="toast" id="toast" style="display:none;"></div>

<script>
// ============================================
// 全局状态
// ============================================
const API = '';

// Electron 桌面环境检测
const isDesktopApp = typeof window.electronAPI !== 'undefined' && window.electronAPI.isDesktop;
if (isDesktopApp) {
  document.body.classList.add('desktop-app');
  document.querySelector('.logo').textContent = '🎵 MusicFlow';
  console.log('[Electron] 运行在桌面应用中');

  // macOS 添加类名用于红绿灯 spacing
  if (window.electronAPI.platform === 'darwin') {
    document.body.classList.add('is-darwin');
  }

  // 监听托盘播放/暂停切换
  if (window.electronAPI.onTogglePlay) {
    window.electronAPI.onTogglePlay(() => {
      if (currentPlayingId) togglePause();
    });
  }
}

let allSongs = [];
let allTags = [];  // 所有标签（含空标签），供侧栏/右键菜单/下拉使用
let reviewMode = false;
let currentFilter = 'all';
let currentFilterValue = '';
let currentView = 'library';  // 当前视图: 'library' | 'search'
let currentPlayingId = null;
let isPlaying = false;
let isPaused = false;
let volumeBeforeMute = 70;
let _scheduleActive = false;  // 服务器上报：当前是否有定时播放的歌曲活跃

// ============================================
// Toast 提示
// ============================================
let toastTimer;
function showToast(msg, type = 'info') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'toast ' + type;
  el.style.display = 'block';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.display = 'none'; }, 2500);
}

// ============================================
// 右键菜单
// ============================================
let contextMenuTarget = { path: '', name: '', artist: '' };

// 点击其他地方关闭右键菜单
document.addEventListener('click', function() {
  document.getElementById('contextMenu').classList.remove('show');
});

function contextMenuPlay() {
  if (contextMenuTarget.path) {
    playSongById(contextMenuTarget.path);
  }
  document.getElementById('contextMenu').classList.remove('show');
}

function contextMenuSchedule() {
  document.getElementById('contextMenu').classList.remove('show');
  if (!contextMenuTarget.path) return;

  const songPath = contextMenuTarget.path;
  const panel = document.getElementById('schedulePanel');
  const overlay = document.getElementById('scheduleOverlay');

  // 如果面板未打开，打开它
  if (!panel.classList.contains('open')) {
    panel.classList.add('open');
    overlay.classList.add('show');
    loadSchedules();
    populateScheduleTagFilter();
    populateSongSelector();
  }

  // 选中右键的歌曲，聚焦到时间输入框
  document.getElementById('scheduleSong').value = songPath;
  document.getElementById('scheduleTime').focus();
  document.querySelector('.schedule-form').scrollIntoView({ behavior: 'smooth' });
}

function contextMenuCopyName() {
  if (contextMenuTarget.name) {
    navigator.clipboard.writeText(contextMenuTarget.name).then(() => {
      showToast('已复制歌名: ' + contextMenuTarget.name, 'success');
    }).catch(() => showToast('复制失败', 'error'));
  }
  document.getElementById('contextMenu').classList.remove('show');
}

function contextMenuCopyArtist() {
  if (contextMenuTarget.artist) {
    navigator.clipboard.writeText(contextMenuTarget.artist).then(() => {
      showToast('已复制歌手: ' + contextMenuTarget.artist, 'success');
    }).catch(() => showToast('复制失败', 'error'));
  }
  document.getElementById('contextMenu').classList.remove('show');
}

async function contextMenuDelete() {
  if (!contextMenuTarget.path) return;
  document.getElementById('contextMenu').classList.remove('show');

  const confirmed = confirm(`确定要删除歌曲 "${contextMenuTarget.name}" 吗？\n此操作不可撤销！`);
  if (!confirmed) return;

  try {
    const resp = await fetch(`${API}/api/delete`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ rel_path: contextMenuTarget.path })
    });
    const data = await resp.json();
    if (data.ok) {
      showToast('歌曲已删除', 'success');
      loadLibrary();
    } else {
      showToast('删除失败: ' + (data.error || '未知错误'), 'error');
    }
  } catch (e) {
    showToast('删除失败: ' + e.message, 'error');
  }
}

// ============================================
// 标签操作：创建标签 & 移动歌曲到标签
// ============================================

function showAddTagInput() {
  document.getElementById('addTagItem').style.display = 'none';
  document.getElementById('addTagRow').style.display = 'block';
  setTimeout(() => document.getElementById('newTagInput').focus(), 50);
}

function cancelAddTag() {
  document.getElementById('addTagRow').style.display = 'none';
  document.getElementById('addTagItem').style.display = '';
  document.getElementById('newTagInput').value = '';
}

async function createTag() {
  const input = document.getElementById('newTagInput');
  const name = input.value.trim();
  if (!name) { showToast('请输入标签名称', 'error'); return; }

  try {
    const resp = await fetch(`${API}/api/tag/create`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name })
    });
    const data = await resp.json();
    if (data.ok) {
      showToast(`标签「${name}」已创建`, 'success');
      cancelAddTag();
      loadLibrary();
    } else {
      showToast(data.error || '创建失败', 'error');
    }
  } catch (e) {
    showToast('创建失败: ' + e.message, 'error');
  }
}

// 右键菜单显示标签子菜单
function showContextMenu(e, relPath, name, artist) {
  e.preventDefault();
  contextMenuTarget = { path: relPath, name: name, artist: artist || '' };
  const menu = document.getElementById('contextMenu');

  // 动态构建标签子菜单（用 allTags：包含空标签，与侧栏一致）
  const submenu = document.getElementById('ctxTagSubmenu');
  const tags = allTags.length ? allTags : ['default'];
  submenu.innerHTML = tags.map(t =>
    `<div class="submenu-item" data-rel-path="${escapeHtml(relPath)}" data-tag="${escapeHtml(t)}">
      📁 ${escapeHtml(t)}
    </div>`
  ).join('') + `
    <div class="submenu-item submenu-new-tag">
      <input type="text" id="ctxNewTagInput" placeholder="+ 输入新标签名..."
             onkeydown="if(event.key==='Enter'){moveSongToNewTag(event);event.preventDefault();}"
             onclick="event.stopPropagation()">
    </div>`;
  submenu.querySelectorAll('.submenu-item[data-tag]').forEach(el => {
    el.addEventListener('click', () => moveSongToTag(el.dataset.relPath, el.dataset.tag));
  });

  menu.style.left = e.clientX + 'px';
  menu.style.top = e.clientY + 'px';
  menu.classList.add('show');
}

async function moveSongToTag(relPath, targetTag) {
  document.getElementById('contextMenu').classList.remove('show');
  try {
    const resp = await fetch(`${API}/api/tag/move`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ rel_path: relPath, tag: targetTag })
    });
    const data = await resp.json();
    if (data.ok) {
      showToast(`已移至「${targetTag}」`, 'success');
      loadLibrary();
    } else {
      showToast(data.error || '移动失败', 'error');
    }
  } catch (e) {
    showToast('移动失败: ' + e.message, 'error');
  }
}

function moveSongToNewTag(event) {
  const input = event.target;
  const tagName = input.value.trim();
  if (!tagName) return;
  moveSongToTag(contextMenuTarget.path, tagName);
}

// ============================================
// 搜索功能（统一搜索：本地库 + 在线 + Web搜索引擎）
// ============================================
async function doSearch() {
  const q = document.getElementById('searchInput').value.trim();
  if (!q) { showToast('请输入搜索关键词', 'error'); return; }

  const overlay = document.getElementById('searchOverlay');
  const grid = document.getElementById('searchGrid');

  currentView = 'search';
  overlay.classList.add('show');
  grid.innerHTML = '<div style="text-align:center;padding:60px;grid-column:1/-1;"><div class="spinner"></div><div style="margin-top:12px;color:var(--text-muted)">正在搜索本地库 + 在线...</div></div>';

  let html = '';
  // Debug 信息仅本地访问 + ?debug=1 时显示
  const showDebug = (window.location.hostname === '127.0.0.1' || window.location.hostname === 'localhost')
    && new URLSearchParams(window.location.search).has('debug');
  let debugHtml = '';

  // 搜索本地库 + 在线（根据工具栏来源选择）
  try {
    const source = document.getElementById('searchSource').value;
    const apiUrl = `${API}/api/search-all?q=${encodeURIComponent(q)}&max=8&source=${source}`;

    // 60 秒超时（防止 fetch 永久挂起）
    const controller = new AbortController();
    const tid = setTimeout(() => controller.abort(), 60000);
    let resp, data;
    try {
      resp = await fetch(apiUrl, { signal: controller.signal, cache: 'no-store' });
      data = await resp.json();
    } finally {
      clearTimeout(tid);
    }

    // 🐛 调试：把 API 真实响应显示在浮层顶部
    debugHtml = `
      <div style="grid-column:1/-1;background:#222;padding:8px 12px;border-radius:6px;margin-bottom:12px;font-size:11px;font-family:monospace;color:#0f0;word-break:break-all;">
        <div>🔗 URL: ${escapeHtml(apiUrl)}</div>
        <div>📡 HTTP: ${resp.status} ${resp.statusText}</div>
        <div>📦 online_count: <b style="color:#ff0">${data.online_count ?? (data.online ? data.online.length : '?')}</b>,
             local_count: <b style="color:#ff0">${data.local_count ?? (data.local ? data.local.length : '?')}</b>,
             ok: ${data.ok}</div>
        <div>🎵 online 前3个: ${data.online ? data.online.slice(0,3).map(r => '"' + r.title + '"').join(' | ') : 'N/A'}</div>
      </div>`;

    if (data.ok) {
      const localSongs = data.local || [];
      const onlineSongs = data.online || [];
      const alreadyLocalIds = new Set(onlineSongs.filter(r => r.already_local).map(r => r.id));

      // 本地已有歌曲
      if (localSongs.length > 0) {
        html += `<div style="grid-column:1/-1;margin-bottom:8px;margin-top:4px;">
          <span style="font-size:15px;font-weight:600;color:var(--green);">💿 本地已有 (${localSongs.length}首)</span>
        </div>`;
        html += localSongs.map(r => `
          <div class="search-result-card" style="border-left:3px solid var(--green);">
            <div class="song-cover" style="background:rgba(46,213,115,0.1);">🎵</div>
            <div class="result-info">
              <div class="result-title">${escapeHtml(r.title)}</div>
              <div class="result-meta">📁 ${escapeHtml(r.tag)} · ${r.size_mb}MB ${r.rating > 0 ? '· ' + '★'.repeat(r.rating) : ''}</div>
            </div>
            <div class="result-actions">
              <button class="btn-play" data-rel-path="${escapeHtml(r.rel_path)}">▶ 播放</button>
            </div>
          </div>
        `).join('');
      }

      // 在线 YT 搜索结果
      if (onlineSongs.length > 0) {
        html += `<div style="grid-column:1/-1;margin-bottom:8px;margin-top:${localSongs.length > 0 ? '20px' : '4px'};">
          <span style="font-size:15px;font-weight:600;color:var(--accent-light);">🌐 在线搜索 (${onlineSongs.length}首)</span>
        </div>`;
        html += onlineSongs.map(r => {
          const isLocal = alreadyLocalIds.has(r.id);
          const localBadge = isLocal ? '<span style="font-size:10px;background:var(--green);color:#000;padding:2px 6px;border-radius:4px;margin-left:6px;">✓ 已下载</span>' : '';
          const downloadBtn = isLocal
            ? `<button class="btn-play" data-video-id="${escapeHtml(r.id)}" data-title="${escapeHtml(r.title)}">▶ 播放</button>`
            : `<button class="btn-download" id="dl-${r.id}" data-video-id="${escapeHtml(r.id)}" data-title="${escapeHtml(r.title)}">⬇ 下载</button>
               <button class="btn-play" data-video-id="${escapeHtml(r.id)}" data-title="${escapeHtml(r.title)}">▶</button>`;
          return `
          <div class="search-result-card" style="${isLocal ? 'opacity:0.7;' : ''}">
            <img class="result-thumb" src="${r.thumbnail || ''}" onerror="this.style.display='none'" alt="">
            <div class="result-info">
              <div class="result-title">${escapeHtml(r.title)}${localBadge}</div>
              <div class="result-meta">${escapeHtml(r.uploader)} · ${r.duration_str}</div>
            </div>
            <div class="result-actions">
              ${downloadBtn}
            </div>
          </div>
        `;
        }).join('');
      }
    }
  } catch (e) {
    debugHtml = `<div style="grid-column:1/-1;background:#222;padding:8px 12px;border-radius:6px;margin-bottom:12px;font-size:11px;font-family:monospace;color:#f00;word-break:break-all;">
      ❌ API 调用失败: ${escapeHtml(String(e))}<br>
      (可能原因: API 超时/网络中断/服务挂了)
    </div>`;
  }

  if (!html.includes('search-result-card')) {
    html = '<div style="text-align:center;padding:60px;grid-column:1/-1;color:var(--text-muted)">😕 没有找到相关歌曲，试试其他关键词</div>';
  }

  try {
    grid.innerHTML = (showDebug ? debugHtml : '') + html;
    // Event listeners for search result buttons
    grid.querySelectorAll('.btn-play[data-rel-path]').forEach(btn => {
      btn.addEventListener('click', (e) => { e.stopPropagation(); playSongById(btn.dataset.relPath); closeSearch(); });
    });
    grid.querySelectorAll('.btn-download[data-video-id]').forEach(btn => {
      btn.addEventListener('click', (e) => { e.stopPropagation(); downloadSong(btn.dataset.videoId, btn.dataset.title); });
    });
    grid.querySelectorAll('.btn-play[data-video-id]').forEach(btn => {
      btn.addEventListener('click', (e) => { e.stopPropagation(); downloadAndPlay(btn.dataset.videoId, btn.dataset.title); });
    });
  } catch (renderErr) {
    grid.innerHTML = `<div style="grid-column:1/-1;padding:40px;color:#f00;">渲染失败: ${escapeHtml(String(renderErr))}</div>`;
  }
}

function closeSearch() {
  currentView = 'library';
  document.getElementById('searchOverlay').classList.remove('show');
}

// ============================================
// 下载功能
// ============================================
async function downloadSong(videoId, title) {
  const btn = document.getElementById('dl-' + videoId);
  const quality = document.getElementById('searchQuality').value;
  const tag = document.getElementById('searchTag').value || 'default';
  if (btn) {
    btn.classList.add('loading');
    btn.textContent = '⏳ 下载中';
  }

  try {
    const resp = await fetch(`${API}/api/download`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ video_id: videoId, title: title, tag: tag, quality: quality }),
    });
    const data = await resp.json();

    if (data.ok) {
      if (data.existed) {
        showToast('🎵 歌曲已存在，直接播放', 'info');
      } else {
        showToast(`✅ 下载完成: ${data.name} (${data.size_mb}MB)`, 'success');
      }
      loadLibrary();
    } else {
      showToast('❌ 下载失败: ' + (data.error || '未知错误'), 'error');
    }
  } catch (e) {
    showToast('❌ 下载失败: ' + e.message, 'error');
  }

  if (btn) {
    btn.classList.remove('loading');
    btn.textContent = '⬇ 下载';
  }
}

async function downloadAndPlay(videoId, title) {
  const btn = document.querySelector(`.btn-play[data-video-id="${videoId}"]`);
  const quality = document.getElementById('searchQuality').value;
  const tag = document.getElementById('searchTag').value || 'default';
  btn.textContent = '⏳';
  btn.disabled = true;

  try {
    // 先下载
    const resp = await fetch(`${API}/api/download`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ video_id: videoId, title: title, tag: tag, quality: quality }),
    });
    const data = await resp.json();

    if (data.ok) {
      showToast('🎵 下载完成，正在播放...', 'success');
      // 刷新库并找到刚下载的歌播放
      await loadLibrary();
      const song = allSongs.find(s => data.path && data.path.includes(s.filename));
      if (song) {
        playSong(song);
      }
      closeSearch();
    } else {
      showToast('❌ 下载失败', 'error');
    }
  } catch (e) {
    showToast('❌ 出错: ' + e.message, 'error');
  }

  btn.textContent = '▶ 播放';
  btn.disabled = false;
}

// ============================================
// 音乐库
// ============================================
async function shutdownServer() {
  if (!confirm('确定要关闭服务器吗？\n\n关闭后需要重新在终端启动。')) return;
  try {
    const resp = await fetch(API + '/api/shutdown', { method: 'POST' });
    const data = await resp.json();
    showToast('服务器已关闭');
    setTimeout(() => { document.body.innerHTML = '<div style="text-align:center;padding:40px;color:#888;">🎵 服务器已关闭</div>'; }, 500);
  } catch (e) {
    showToast('服务器已关闭');
  }
}

// ============================================
// 仅桌面播放开关
// ============================================
let _desktopOnlyMode = true;

function initDesktopOnlyMode() {
  if (!isDesktopApp) {
    // 网页端：默认开启"仅桌面播放"，持久化用户选择
    const saved = localStorage.getItem('desktopOnlyMode');
    _desktopOnlyMode = saved !== null ? saved === 'true' : true;
  } else {
    // 桌面端：默认也显示"仅桌面"，且桌面本身就是播放端，始终响应
    _desktopOnlyMode = true;
  }
  updateDesktopOnlyBtn();
}

function toggleDesktopOnly() {
  _desktopOnlyMode = !_desktopOnlyMode;
  localStorage.setItem('desktopOnlyMode', _desktopOnlyMode.toString());
  updateDesktopOnlyBtn();
  if (_desktopOnlyMode) {
    showToast('已开启"仅桌面播放"：网页端不响应定时音乐');
  } else {
    showToast('已关闭"仅桌面播放"：网页端也响应定时音乐');
  }
}

function updateDesktopOnlyBtn() {
  const btn = document.getElementById('btnDesktopOnly');
  if (!btn) return;
  if (_desktopOnlyMode) {
    btn.className = 'desktop-only-btn on';
    btn.textContent = '📱 仅桌面';

async function loadLibrary() {
  try {
    const resp = await fetch(`${API}/api/library`);

    allSongs = data.songs;

function updateSidebarCounts(data) {

  document.getElementById('countLike').textContent = data.songs.filter(s => s.rating === 2).length;

function renderTagList(tags) {

    `<div class="sidebar-item tag-item" draggable="true"

// ============================================
// 标签拖拽排序
// ============================================
let _dragTag = null;

function tagDragStart(e) {
  _dragTag = e.currentTarget.dataset.tag;
  e.currentTarget.style.opacity = '0.5';
  // Firefox 需要设置数据才能触发 drag
  e.dataTransfer.effectAllowed = 'move';
  e.dataTransfer.setData('text/plain', _dragTag);
}

function tagDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
}

function tagDragEnd(e) {
  e.currentTarget.style.opacity = '';
  _dragTag = null;
}

function tagDrop(e) {
  e.preventDefault();
  e.stopPropagation();
  const targetTag = e.currentTarget.dataset.tag;
  if (!_dragTag || _dragTag === targetTag) {
    e.currentTarget.style.opacity = '';
    return;
  }
  const container = document.getElementById('tagList');
  const items = [...container.querySelectorAll('.tag-item')];
  const dragIdx = items.findIndex(el => el.dataset.tag === _dragTag);
  const targetIdx = items.findIndex(el => el.dataset.tag === targetTag);
  if (dragIdx === -1 || targetIdx === -1) {
    e.currentTarget.style.opacity = '';
    return;
  }
  // 生成新顺序
  const newOrder = items.map(el => el.dataset.tag);
  newOrder.splice(dragIdx, 1);
  newOrder.splice(targetIdx, 0, _dragTag);
  // 立即更新界面
  saveTagOrder(newOrder);
  // 更新本地 allTags 并重新渲染
  allTags = newOrder;
  renderTagList(newOrder);
}

async function saveTagOrder(order) {
  try {
    const resp = await fetch(`${API}/api/tags/order`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ order })
    });
    const data = await resp.json();
    if (data.ok) {
      showToast('标签顺序已保存', 'success');
    } else {
      showToast(data.error || '保存顺序失败', 'error');
    }
  } catch (e) {
    showToast('保存顺序失败: ' + e.message, 'error');
  }
}

function populateSearchTags(tags) {
  const select = document.getElementById('searchTag');
  if (!select) return;
  const currentVal = select.value;
  select.innerHTML = '<option value="default">默认</option>' +
    tags.map(t => `<option value="${t}">📁 ${t}</option>`).join('');
  // 恢复之前的选择
  if ([...select.options].some(o => o.value === currentVal)) {
    select.value = currentVal;
  }
}

function filterBy(type, value = '') {
  currentFilter = type;
  currentFilterValue = value;

  // 更新侧边栏激活状态
  document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
  const selector = type === 'all' ? '[data-filter="all"]' :
    type === 'rating' ? `[data-filter="rating${value}"]` :
    `[data-filter="tag${value}"]`;
  const activeEl = document.querySelector(selector);
  if (activeEl) activeEl.classList.add('active');

  applyFilter();
}

// 审核模式
// ============================================
function toggleReviewMode() {
  reviewMode = !reviewMode;
  const btn = document.getElementById('btnReview');

  if (reviewMode) {
    document.body.classList.add('review-mode');
    btn.classList.add('active');
    document.getElementById('contentTitle').textContent = '🔍 审核未标记歌曲';
  } else {
    document.body.classList.remove('review-mode');
    btn.classList.remove('active');
    document.getElementById('contentTitle').textContent = '📚 全部歌曲';
  }

  // 退出审核时重置 filter 到全部，避免 sidebar 状态不一致
  if (!reviewMode) {
    currentFilter = 'all';
    currentFilterValue = '';
    const allBtn = document.querySelector('.sidebar-item[data-filter="all"]');
    document.querySelectorAll('.sidebar-item').forEach(el => el.classList.remove('active'));
    if (allBtn) allBtn.classList.add('active');
  }

  applyFilter();
}

async function reviewConfirm(relPath, nameInput, artistInput) {
  const btn = nameInput.closest('.song-item').querySelector('.song-review-confirm');
  const name = nameInput.value.trim();
  const artist = artistInput.value.trim();

  if (!name) { showToast('请输入歌名', 'error'); return; }

  btn.disabled = true;
  btn.textContent = '保存中...';

  try {
    const resp = await fetch(`${API}/api/update-song`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ rel_path: relPath, name, artist })
    });
    const data = await resp.json();

    if (data.ok) {
      // 更新本地数据
      const song = allSongs.find(s => s.rel_path === relPath);
      if (song) { song.name = name; song.artist = artist; song.name_confident = true; }

      // 更新播放器显示
      if (currentPlayingId === relPath) {
        document.getElementById('nowPlaying').textContent = name;
      }

      showToast('✅ 已确认', 'success');

      // 自动播 3 秒试听，然后跳到下一首
      await playSongById(relPath);
      await new Promise(r => setTimeout(r, 3000));
      reviewSkipToNext(relPath);
    } else {
      showToast('❌ 保存失败: ' + (data.error || ''), 'error');
      btn.disabled = false;
      btn.textContent = '✓ 确认';
    }
  } catch (e) {
    showToast('❌ 网络错误', 'error');
    btn.disabled = false;
    btn.textContent = '✓ 确认';
  }
}

function reviewSkipToNext(currentRelPath) {
  // 在审核列表中找到当前歌曲的下一首未确认歌曲，播放它
  const unconfirmed = allSongs.filter(s => !s.name_confident);
  const curIdx = unconfirmed.findIndex(s => s.rel_path === currentRelPath);
  if (curIdx >= 0 && curIdx < unconfirmed.length) {
    // 当前仍在审核列表，重新渲染即可（它已被移除）
    applyFilter();
    // 播下一首试听
    const newList = allSongs.filter(s => !s.name_confident);
    if (newList.length > 0) {
      const next = curIdx < newList.length ? newList[curIdx] : newList[newList.length - 1];
      playSongById(next.rel_path);
    }
  }
}

function reviewPlayPreview(relPath) {
  playSongById(relPath);
}

async function searchSongCandidate(relPath, idSuffix) {
  const btn = document.getElementById('btnSearch_' + idSuffix);
  const resultBox = document.getElementById('searchResult_' + idSuffix);
  if (!btn || !resultBox) return;

  // 切换显示/隐藏
  if (resultBox.classList.contains('show')) {
    resultBox.classList.remove('show');
    return;
  }

  // 显示加载状态
  btn.classList.add('loading');
  btn.textContent = '⏳';
  resultBox.classList.add('show');
  resultBox.innerHTML = '<div class="search-no-result">正在搜索中...</div>';

  try {
    const resp = await fetch(`${API}/api/search-song`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ rel_path: relPath })
    });
    const data = await resp.json();

    if (!data.ok) {
      resultBox.innerHTML = `<div class="search-no-result">${data.hint || data.error || '搜索失败'}</div>`;
      btn.classList.remove('loading');
      btn.textContent = '🔍';
      return;
    }

    if (data.candidates.length === 0) {
      resultBox.innerHTML = `<div class="search-no-result">未找到匹配结果<br><span style="font-size:11px;color:var(--text-muted)">搜索词: ${escapeHtml(data.query)}</span></div>`;
      btn.classList.remove('loading');
      btn.textContent = '🔍';
      return;
    }

    resultBox.innerHTML = `
      <div style="padding:6px 14px;font-size:11px;color:var(--text-muted);border-bottom:1px solid var(--border)">搜索: ${escapeHtml(data.query)} — ${data.candidates.length} 个结果</div>
      ${data.candidates.map(c => `
        <div class="search-result-item">
          <div class="search-result-info">
            <div class="search-result-name">${escapeHtml(c.name)}</div>
            ${c.artist ? `<div class="search-result-artist">${escapeHtml(c.artist)}</div>` : ''}
          </div>
          <button class="search-result-pick" data-id-suffix="${idSuffix}" data-name="${escapeHtml(c.name)}" data-artist="${escapeHtml(c.artist || '')}">选用</button>
        </div>
      `).join('')}
    `;
    resultBox.querySelectorAll('.search-result-pick').forEach(btn => {
      btn.addEventListener('click', (e) => { e.stopPropagation(); pickSearchResult(btn.dataset.idSuffix, btn.dataset.name, btn.dataset.artist); });
    });
  } catch (e) {
    resultBox.innerHTML = '<div class="search-no-result">网络错误，请重试</div>';
  }

  btn.classList.remove('loading');
  btn.textContent = '🔍';
}

function pickSearchResult(idSuffix, name, artist) {
  const nameInput = document.getElementById('reviewName_' + idSuffix);
  const artistInput = document.getElementById('reviewArtist_' + idSuffix);
  const resultBox = document.getElementById('searchResult_' + idSuffix);
  if (nameInput) nameInput.value = name;

async function recognizeSongById(relPath, idSuffix) {
  const btn = document.getElementById('btnReco_' + idSuffix);
  const resultBox = document.getElementById('recoResult_' + idSuffix);
  const searchResultBox = document.getElementById('searchResult_' + idSuffix);
  if (!btn || !resultBox) return;

  if (resultBox.classList.contains('show')) {
    resultBox.classList.remove('show');
    return;
  }

  if (searchResultBox) searchResultBox.classList.remove('show');

  btn.classList.add('loading');
  btn.textContent = '⏳';
  resultBox.classList.add('show');
  resultBox.innerHTML = '<div class="search-no-result">🎵 正在听歌识曲...<br><span style="font-size:11px;color:var(--text-muted)">音频指纹匹配中，约 10-15 秒</span></div>';

  const startTime = Date.now();

  try {
    const resp = await fetch(`${API}/api/recognize-song`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ rel_path: relPath })
    });
    const data = await resp.json();

    if (!data.ok) {
      resultBox.innerHTML = `<div class="search-no-result">❌ ${data.error || '识曲失败'}</div>`;
      btn.classList.remove('loading');
      btn.textContent = '🎵';
      return;
    }

    const elapsed = ((Date.now() - startTime) / 1000).toFixed(1);
    const cachedTag = data.cached ? '♻️ 缓存命中' : '🎵 Shazam 识别';

    if (data.candidates.length === 0) {
      resultBox.innerHTML = `<div class="search-no-result">😔 未识别出该歌曲<br><span style="font-size:11px;color:var(--text-muted)">耗时 ${elapsed}s · 可能是冷门歌曲或纯音乐</span></div>`;
      btn.classList.remove('loading');
      btn.textContent = '🎵';
      return;
    }

    resultBox.innerHTML = `
      <div style="padding:6px 14px;font-size:11px;color:var(--text-muted);border-bottom:1px solid var(--border)">${cachedTag} · 耗时 ${elapsed}s</div>
      ${data.candidates.map(c => `
        <div class="search-result-item">
          <div class="search-result-info">
            <div class="search-result-name">${escapeHtml(c.name)}</div>
            ${c.artist ? `<div class="search-result-artist">${escapeHtml(c.artist)}</div>` : ''}
          </div>
          <button class="search-result-pick" data-id-suffix="${idSuffix}" data-name="${escapeHtml(c.name)}" data-artist="${escapeHtml(c.artist || '')}">选用</button>
        </div>
      `).join('')}
    `;
    resultBox.querySelectorAll('.search-result-pick').forEach(btn => {
      btn.addEventListener('click', (e) => { e.stopPropagation(); pickRecoResult(btn.dataset.idSuffix, btn.dataset.name, btn.dataset.artist); });
    });
  } catch (e) {
    resultBox.innerHTML = '<div class="search-no-result">⚠️ 请求超时，请重试</div>';
  }

  btn.classList.remove('loading');
  btn.textContent = '🎵';
}

function pickRecoResult(idSuffix, name, artist) {

function applyFilter() {
  let songs = allSongs;

  if (reviewMode) {
    // 审核模式：只显示未确认的歌
    songs = songs.filter(s => !s.name_confident);
    document.getElementById('contentTitle').textContent = '🔍 审核未标记歌曲';
    document.getElementById('reviewRemain').textContent = songs.length;
  } else if (currentFilter === 'rating') {
    songs = songs.filter(s => s.rating === parseInt(currentFilterValue));
    document.getElementById('contentTitle').textContent =
      ['', '👌 一般喜欢', '👍 比较喜欢', '⭐ 我的最爱'][currentFilterValue] || '筛选结果';
  } else if (currentFilter === 'tag') {
    songs = songs.filter(s => s.tag === currentFilterValue);
    document.getElementById('contentTitle').textContent = `📁 ${currentFilterValue}`;
  } else {
    document.getElementById('contentTitle').textContent = '📚 全部歌曲';
  }

  document.getElementById('contentCount').textContent = `共 ${songs.length} 首`;

  const listEl = document.getElementById('songList');

  if (songs.length === 0) {
    if (reviewMode) {
      listEl.innerHTML = `
        <div class="empty-state">
          <div class="icon">🎉</div>
          <div class="text">所有歌曲已确认完毕！</div>
          <div class="hint">没有需要审核的歌曲了</div>
        </div>`;
    } else {
      listEl.innerHTML = `
        <div class="empty-state">
          <div class="icon">🎵</div>
          <div class="text">这里还没有歌曲</div>
          <div class="hint">使用顶部搜索框搜索并下载歌曲吧</div>
        </div>`;
    }
    return;
  }

  listEl.innerHTML = songs.map((s, i) => {
    const isPlaying = s.rel_path === currentPlayingId;
    const idSuffix = s.rel_path.replace(/[^a-zA-Z0-9\u4e00-\u9fff]/g, '_');

    if (reviewMode) {
      // 审核模式：内联编辑表单
      const resultBoxId = `searchResult_${idSuffix}`;
      const recoResultId = `recoResult_${idSuffix}`;
      return `
        <div class="song-item ${isPlaying ? 'playing' : ''}" style="position:relative;flex-wrap:wrap;">
          <div class="song-index">${i + 1}</div>
          <div class="song-cover" data-rel-path="${escapeHtml(s.rel_path)}" title="点击试听">🔊</div>
          <div class="song-review-row">
            <input class="song-review-input" id="reviewName_${idSuffix}" value="${escapeHtml(s.name)}" placeholder="歌名" onclick="event.stopPropagation()">
            <input class="song-review-input song-review-artist" id="reviewArtist_${idSuffix}" value="${escapeHtml(s.artist || '')}" placeholder="歌手(可选)" onclick="event.stopPropagation()">
            <span class="song-tag">${escapeHtml(s.tag)}</span>
          </div>
          <button class="song-review-btn song-review-search" id="btnSearch_${idSuffix}" data-rel-path="${escapeHtml(s.rel_path)}" data-id-suffix="${idSuffix}" title="联网搜索正确歌名">🔍</button>
          <button class="song-review-btn song-review-shazam" id="btnReco_${idSuffix}" data-rel-path="${escapeHtml(s.rel_path)}" data-id-suffix="${idSuffix}" title="Shazam 听歌识曲">🎵</button>
          <button class="song-review-btn song-review-confirm" data-rel-path="${escapeHtml(s.rel_path)}" title="确认">✓ 确认</button>
          <button class="song-review-btn song-review-skip" data-rel-path="${escapeHtml(s.rel_path)}" title="跳过">跳过 ▸</button>
          <div class="search-results" id="${resultBoxId}"></div>
          <div class="search-results" id="${recoResultId}"></div>
        </div>`;
    }

    // 正常模式
    const stars = [1,2,3].map(r =>
      `<span class="star ${s.rating >= r ? 'active' : ''}"
             data-rel-path="${escapeHtml(s.rel_path)}" data-rating="${s.rating === r ? 0 : r}"
             title="${r}星">★</span>`
    ).join('');

    return `
      <div class="song-item ${isPlaying ? 'playing' : ''}" data-rel-path="${escapeHtml(s.rel_path)}" data-song-name="${escapeHtml(s.name)}" data-song-artist="${escapeHtml(s.artist || '')}">
        <div class="song-index">${i + 1}</div>
        <div class="song-cover">🎵</div>
        <div class="song-info">
          <div class="song-name" id="songName_${idSuffix}">${s.name_confident ? '<span class="song-verified" title="✓ 歌名可信">✓</span>' : ''}${escapeHtml(s.name)}</div>
          ${s.artist ? `<div class="song-artist" id="songArtist_${idSuffix}">${escapeHtml(s.artist)}</div>` : ''}
          <div class="song-tag">${escapeHtml(s.tag)}</div>
        </div>
        <div class="song-rating">${stars}</div>
        <button class="song-play-btn" data-rel-path="${escapeHtml(s.rel_path)}" title="播放">▶️</button>
        <div class="song-duration">${s.size_mb}MB</div>
        <button class="song-rename-btn" data-rel-path="${escapeHtml(s.rel_path)}" title="重命名">✏️</button>
        <div class="song-size"></div>
      </div>
    `;
  }).join('');
  attachSongListEvents(listEl);
}

function attachSongListEvents(container) {
  // Dblclick handlers for song-items: play on double-click
  container.querySelectorAll('.song-item[data-rel-path]').forEach(el => {
    const rp = el.dataset.relPath;
    el.addEventListener('dblclick', () => playSongById(rp));
    // Right-click context menu
    el.addEventListener('contextmenu', (e) => {
      e.preventDefault();
      showContextMenu(e, rp, el.dataset.songName || '', el.dataset.songArtist || '');
    });
  });

  // Play button
  container.querySelectorAll('.song-play-btn[data-rel-path]').forEach(btn => {
    btn.addEventListener('click', (e) => { e.stopPropagation(); playSongById(btn.dataset.relPath); });
  });

  // Rename button
  container.querySelectorAll('.song-rename-btn[data-rel-path]').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      const item = btn.closest('.song-item');
      startRename(btn.dataset.relPath, item ? item.dataset.songName : '', item ? item.dataset.songArtist : '');
    });
  });

  // Star rating
  container.querySelectorAll('.star[data-rel-path]').forEach(star => {
    star.addEventListener('click', (e) => {
      e.stopPropagation();
      rateSong(star.dataset.relPath, parseInt(star.dataset.rating) || 0);
    });
  });

  // Review mode: play preview
  container.querySelectorAll('.song-cover[data-rel-path]').forEach(el => {
    el.addEventListener('click', () => reviewPlayPreview(el.dataset.relPath));
  });

  // Review mode: search button
  container.querySelectorAll('.song-review-search[data-rel-path]').forEach(btn => {
    btn.addEventListener('click', (e) => { e.stopPropagation(); searchSongCandidate(btn.dataset.relPath, btn.dataset.idSuffix); });
  });

  // Review mode: shazam button
  container.querySelectorAll('.song-review-shazam[data-rel-path]').forEach(btn => {
    btn.addEventListener('click', (e) => { e.stopPropagation(); recognizeSongById(btn.dataset.relPath, btn.dataset.idSuffix); });
  });

  // Review mode: confirm button
  container.querySelectorAll('.song-review-confirm[data-rel-path]').forEach(btn => {
    btn.addEventListener('click', () => {
      const rp = btn.dataset.relPath;
      const idSuffix = rp.replace(/[^a-zA-Z0-9\u4e00-\u9fff]/g, '_');
      reviewConfirm(rp, document.getElementById('reviewName_' + idSuffix), document.getElementById('reviewArtist_' + idSuffix));
    });
  });

  // Review mode: skip button
  container.querySelectorAll('.song-review-skip[data-rel-path]').forEach(btn => {
    btn.addEventListener('click', () => reviewSkipToNext(btn.dataset.relPath));
  });
}

function startRename(relPath, currentName, currentArtist) {
  const song = allSongs.find(s => s.rel_path === relPath);
  if (!song) return;
  
  const idSuffix = relPath.replace(/[^a-zA-Z0-9\u4e00-\u9fff]/g, '_');
  const nameEl = document.getElementById('songName_' + idSuffix);
  if (!nameEl) return;
  
  // ── 歌名输入框 ──
  const nameInput = document.createElement('input');
  nameInput.type = 'text';
  nameInput.className = 'song-rename-input';
  nameInput.id = nameEl.id;
  nameInput.value = song.name;
  nameInput.dataset.relPath = relPath;
  nameInput.dataset.origName = song.name;
  nameInput.dataset.inputType = 'name';
  nameInput.placeholder = '歌曲名';
  nameEl.replaceWith(nameInput);
  
  // ── 歌手输入框 ──
  const artistEl = document.getElementById('songArtist_' + idSuffix);
  const artistInput = document.createElement('input');
  artistInput.type = 'text';
  artistInput.className = 'song-rename-input song-rename-artist';
  artistInput.id = 'songArtist_' + idSuffix;
  artistInput.value = song.artist || '';
  artistInput.dataset.relPath = relPath;
  artistInput.dataset.origArtist = song.artist || '';
  artistInput.dataset.inputType = 'artist';
  artistInput.placeholder = '歌手（可选）';
  
  if (artistEl) {
    artistEl.replaceWith(artistInput);
  } else {
    // 如果之前没有歌手 div，在 nameInput 后面插入
    nameInput.insertAdjacentElement('afterend', artistInput);
  }
  
  nameInput.focus();
  nameInput.select();
  
  // 回车/退出统一处理
  const handleKeydown = (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      finishRename(nameInput, artistInput);
    } else if (e.key === 'Escape') {
      cancelRename(nameInput, artistInput);
    }
  };
  nameInput.onkeydown = handleKeydown;
  artistInput.onkeydown = handleKeydown;
  
  // 焦点离开时提交（Tab 切换时等一会）
  nameInput.onblur = () => {
    setTimeout(() => {
      if (document.activeElement !== artistInput) finishRename(nameInput, artistInput);
    }, 150);
  };
  artistInput.onblur = () => {
    setTimeout(() => {
      if (document.activeElement !== nameInput) finishRename(nameInput, artistInput);
    }, 150);
  };
}

function cancelRename(nameInput, artistInput) {
  const origName = nameInput.dataset.origName;
  replaceInputWithSpan(nameInput, origName);
  replaceArtistWithSpan(artistInput, artistInput.dataset.origArtist);
}

async function finishRename(nameInput, artistInput) {
  const newName = (nameInput.value || '').trim();
  const newArtist = artistInput ? (artistInput.value || '').trim() : '';
  const relPath = nameInput.dataset.relPath;
  const origName = nameInput.dataset.origName;
  const origArtist = artistInput ? (artistInput.dataset.origArtist || '') : '';
  
  if (!newName) {
    showToast('⚠️ 歌名不能为空', 'warning');
    nameInput.focus();
    return;
  }
  
  const nameChanged = newName !== origName;
  const artistChanged = newArtist !== origArtist;
  
  if (!nameChanged && !artistChanged) {
    cancelRename(nameInput, artistInput);
    return;
  }
  
  nameInput.disabled = true;
  nameInput.style.opacity = '0.6';
  if (artistInput) { artistInput.disabled = true; artistInput.style.opacity = '0.6'; }
  
  try {
    const body = { rel_path: relPath, new_name: newName };
    if (artistChanged) body.artist = newArtist;
    
    const resp = await fetch(`${API}/api/rename`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await resp.json();
    
    if (data.ok) {
      const song = allSongs.find(s => s.rel_path === relPath);
      if (song) {
        song.name = newName;
        if (artistChanged) song.artist = newArtist;
      }
      
      replaceInputWithSpan(nameInput, newName);
      replaceArtistWithSpan(artistInput, newArtist);
      showToast('✅ 已更新', 'success');
      
      if (currentPlayingId === relPath) {
        document.getElementById('nowPlaying').textContent = newName;
      }
    } else {
      cancelRename(nameInput, artistInput);
      showToast('❌ 重命名失败: ' + (data.error || '未知错误'), 'error');
    }
  } catch (e) {
    cancelRename(nameInput, artistInput);
    showToast('❌ 网络错误', 'error');
  }
}

function replaceInputWithSpan(input, text) {
  const span = document.createElement('span');
  span.textContent = text;
  span.className = 'song-name';
  span.id = input.id;
  input.replaceWith(span);
}

function replaceArtistWithSpan(artistInput, artistText) {
  if (!artistInput) return;
  if (artistText) {
    const div = document.createElement('div');
    div.className = 'song-artist';
    div.id = artistInput.id;
    div.textContent = artistText;
    artistInput.replaceWith(div);
  } else {
    // 歌手为空，移除元素
    artistInput.remove();
  }
}

async function playSongById(relPath) {
  const song = allSongs.find(s => s.rel_path === relPath);

}

async function playSong(song) {
  try {
    // 构建完整播放列表（用于循环模式）
    const playlist = getVisibleSongs();
    const idx = playlist.findIndex(s => s.rel_path === song.rel_path);
    
    const resp = await fetch(`${API}/api/play`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ 
        path: song.rel_path,
        playlist: playlist.map(s => ({ rel_path: s.rel_path, path: s.path })),
        index: idx >= 0 ? idx : 0
      }),
    });
    const data = await resp.json();

    if (data.ok) {
      currentPlayingId = song.rel_path;
      isPlaying = true;
      isPaused = false;
      updatePlayerUI(song.name, song.artist || '', song.tag);
      document.getElementById('btnPlay').textContent = '⏸';
      applyFilter(); // 刷新高亮
      scrollToPlayingSong();
      showFloatingPlayer(song.name, song.artist || '', song.tag);
    } else {
      showToast('播放失败: ' + (data.error || '未知错误'), 'error');
    }
  } catch (e) {
    showToast('播放失败: ' + e.message, 'error');
  }
}

function scrollToPlayingSong() {
  const playingEl = document.querySelector('.song-item.playing');
  if (playingEl) {
    playingEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

async function togglePlay() {
  if (!currentPlayingId && allSongs.length > 0) {
    // 没有在播放，播放第一首
    await playSong(allSongs[0]);
    return;
  }
  if (!currentPlayingId) return;

  try {
    const resp = await fetch(`${API}/api/pause`, { method: 'POST' });
    const data = await resp.json();
    if (data.ok) {
      isPaused = data.paused;
      isPlaying = !data.paused;
      document.getElementById('btnPlay').textContent = data.paused ? '▶' : '⏸';
    }
  } catch (e) {
    console.error('暂停失败:', e);
  }
}

  currentPlayingId = null;
  isPlaying = false;
  isPaused = false;

// ============================================
// 进度条拖拽
// ============================================
let isSeeking = false;
let seekTargetPct = 0;
let cachedDuration = 0;  // 缓存歌曲时长，避免拖拽时频繁查状态
let seekAnimFrame = null;

function seekStart(e) {
  isSeeking = true;
  document.body.style.userSelect = 'none';  // 拖拽时禁止文字选中
  updateSeekUI(e);
  e.preventDefault();
}

function seekDrag(e) {
  if (!isSeeking) return;
  e.preventDefault();
  if (seekAnimFrame) cancelAnimationFrame(seekAnimFrame);
  seekAnimFrame = requestAnimationFrame(() => updateSeekUI(e));
}

function updateSeekUI(e) {
  const bar = document.getElementById('progressBar');
  const rect = bar.getBoundingClientRect();
  const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
  document.getElementById('progressFill').style.width = (pct * 100) + '%';
  document.getElementById('currentTime').textContent = formatTime(cachedDuration * pct);
  seekTargetPct = pct;
}

function seekEnd(e) {
  if (!isSeeking) return;
  document.body.style.userSelect = '';
  if (seekAnimFrame) { cancelAnimationFrame(seekAnimFrame); seekAnimFrame = null; }
  // isSeeking 仍为 true，由 doSeek 完成后才重置
  doSeek(seekTargetPct);
}

async function doSeek(pct) {
  try {
    const position = Math.round(cachedDuration * pct);
    await fetch(`${API}/api/seek`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ position: position })
    });

    // VLC 跳转很快，80ms 足够
    await new Promise(r => setTimeout(r, 80));

    // 拉取服务器真实位置并刷新
    const resp = await fetch(`${API}/api/status`);
    const data = await resp.json();
    if (data.duration > 0) cachedDuration = data.duration;
    const realPct = data.duration > 0 ? (data.position / data.duration) * 100 : pct * 100;
    document.getElementById('progressFill').style.width = Math.min(realPct, 100) + '%';
    document.getElementById('currentTime').textContent = formatTime(data.position);
    document.getElementById('totalTime').textContent = formatTime(data.duration);
  } catch (e) {
    console.error('[seek] 出错:', e);
  } finally {
    isSeeking = false;
  }
}
