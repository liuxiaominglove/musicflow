// ============================================
// 状态轮询
// ============================================
let stuckSamePositionCount = 0;  // 安全网：检测歌曲尾部卡住
let lastPolledPosition = -1;

async function pollStatus() {
  try {
    const resp = await fetch(`${API}/api/status`);
    const data = await resp.json();

    // active = 播放中 或 暂停中（有活跃媒体）
    const isActive = data.active !== undefined ? data.active : data.playing;

    // 从服务器同步定时播放状态（权威来源）
    _scheduleActive = data.schedule_active === true;

    if (isActive) {
      if (data.duration > 0) cachedDuration = data.duration;

      // "仅桌面播放"模式：桌面端始终响应，网页端仅非外部触发或关闭开关时响应
      const isExternalTrigger = !currentPlayingId;
      const shouldSilence = !isDesktopApp && _desktopOnlyMode && isExternalTrigger;

      // 浮动播放器: 同步歌曲信息并自动显示
      if (data.current_name) {
        if (!shouldSilence) {
          const fp = document.getElementById('floatingPlayer');
          document.getElementById('floatingPlayerName').textContent = data.current_name;
          document.getElementById('floatingPlayerTag').textContent = data.current_artist || '';
          // 定时触发时把窗口带到前台
          if (isExternalTrigger) {
            if (isDesktopApp && window.electronAPI && window.electronAPI.bringToFront) {
              window.electronAPI.bringToFront();
            }
          }
          // 同步暂停/播放状态到浮动条
          document.getElementById('floatingBtnPlay').textContent = data.paused ? '▶' : '⏸';
          // 更新托盘
          updateTray(data.current_name, data.current_artist);
        }
        // 同步主播放器信息（静默模式下跳过外部触发）
        if (!shouldSilence) {
          if (!currentPlayingId) {
            document.getElementById('nowPlaying').textContent = data.current_name;
            document.getElementById('nowArtist').textContent = data.current_artist || '';
            document.getElementById('btnPlay').textContent = data.paused ? '▶' : '⏸';
            isPlaying = !data.paused;
            isPaused = data.paused;
          }
        }
      }

      // 安全网：仅在真正播放中（非暂停）时检测尾部卡住
      if (data.playing && !data.paused) {
        if (data.duration > 2 && data.position >= data.duration - 1.5) {
          if (Math.abs(data.position - lastPolledPosition) < 0.2) {
            stuckSamePositionCount++;
            if (stuckSamePositionCount >= 3) {
              console.log('[poll] 歌曲尾部卡住，触发安全切歌');
              stuckSamePositionCount = 0;
              lastPolledPosition = -1;
              await fetch(`${API}/api/next`);
            }
          } else {
            stuckSamePositionCount = 0;
          }
        } else {
          stuckSamePositionCount = 0;
        }
        lastPolledPosition = data.position;
      }

      // 拖拽时不更新进度条，避免冲突
      if (!isSeeking && data.playing) {
        document.getElementById('currentTime').textContent = formatTime(data.position);
        document.getElementById('totalTime').textContent = formatTime(data.duration);

        if (data.duration > 0) {
          const pct = (data.position / data.duration) * 100;
          document.getElementById('progressFill').style.width = Math.min(pct, 100) + '%';
        }
      }

      if (data.current_name) {
        document.getElementById('nowPlaying').textContent = data.current_name;
        document.getElementById('nowArtist').textContent = data.current_artist || '';
      }
    } else {
      // 停止时清除浮动播放器内容和托盘信息
      if (!currentPlayingId) {
        document.getElementById('floatingPlayerName').textContent = '待播放';
        document.getElementById('floatingPlayerTag').textContent = '';
        updateTray('', '');
      }
    }

    // 同步循环模式
    if (data.loop_mode) {
      updateLoopButtons(data.loop_mode);
    }

    // 同步音量
    const slider = document.getElementById('volumeSlider');
    if (Math.abs(parseInt(slider.value) - data.volume) > 2) {
      slider.value = data.volume;
    }
  } catch (e) {}
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function formatTime(seconds) {
  if (!seconds || seconds < 0) return '0:00';
  const m = Math.floor(seconds / 60);
  const s = Math.floor(seconds % 60);
  return `${m}:${s.toString().padStart(2, '0')}`;
}

function renderScheduleList(items) {

  if (!items || items.length === 0) {
    container.innerHTML = '<div class="schedule-empty">还没有定时任务<br>在上面添加一个吧</div>';
    return;
  }

  // 按时间排序
  items.sort((a, b) => (a.time || '').localeCompare(b.time || ''));

  container.innerHTML = items.map(item => {
    const cls = item.enabled ? '' : 'disabled';
    const toggleCls = item.enabled ? 'on' : '';
    return `
      <div class="schedule-item ${cls}" id="schedule-item-${item.id}">
        <span class="schedule-time">${item.time}</span>
        <div class="schedule-song-info">
          <div class="schedule-song-name" title="${item.song_name}">${item.song_name || item.song_path.split('/').pop()}</div>
          <div class="schedule-song-meta">音量 ${item.volume}%</div>
        </div>
        <button class="schedule-edit" onclick="editScheduleItem('${item.id}')" title="编辑">✏️</button>
        <button class="schedule-toggle ${toggleCls}" onclick="toggleSchedule('${item.id}')" title="${item.enabled ? '禁用' : '启用'}"></button>
        <button class="schedule-delete" onclick="deleteSchedule('${item.id}')" title="删除">×</button>
      </div>
    `;
  }).join('');
}

function populateSongSelector() {

  const tagFilter = document.getElementById('scheduleTagFilter')?.value || '';

  const selPrev = select.value;  // 保留之前选中的值

  select.innerHTML = '<option value="">-- 请选择歌曲 --</option>';

  if (!allSongs || allSongs.length === 0) {
    select.innerHTML += '<option value="" disabled>请先加载歌曲库</option>';
    return;
  }

  // 应用标签筛选
  let filtered = allSongs;
  if (tagFilter) {
    filtered = filtered.filter(s => (s.tag || '未分类') === tagFilter);
  }

  // 应用喜欢程度筛选
  if (ratingFilter !== '') {
    const target = parseInt(ratingFilter);
    filtered = filtered.filter(s => (s.rating || 0) === target);
  }

  // 应用搜索文本筛选（支持歌名/歌手/拼音模糊匹配）
  const searchText = (document.getElementById('scheduleSearchInput')?.value || '').trim().toLowerCase();
  if (searchText) {
    filtered = filtered.filter(s => {
      return (s.name || '').toLowerCase().includes(searchText) ||
             (s.artist || '').toLowerCase().includes(searchText) ||
             (s.name_pinyin || '').includes(searchText) ||
             (s.artist_pinyin || '').includes(searchText);
    });
  }

  if (filtered.length === 0) {
    select.innerHTML += '<option value="" disabled>没有符合条件的歌曲</option>';
    return;
  }

  // 按标签分组
  const grouped = {};
  filtered.forEach(s => {
    const tag = s.tag || '未分类';
    if (!grouped[tag]) grouped[tag] = [];
    grouped[tag].push(s);
  });

  let restored = false;
  Object.keys(grouped).sort().forEach(tag => {
    const optgroup = document.createElement('optgroup');
    optgroup.label = `📁 ${tag} (${grouped[tag].length}首)`;

    grouped[tag].sort((a, b) => (a.name || '').localeCompare(b.name || '')).forEach(s => {
      const option = document.createElement('option');
      option.value = s.rel_path;
      option.textContent = `${s.name} ${s.rating > 0 ? '★'.repeat(s.rating) : ''}`;
      if (s.rel_path === selPrev) { option.selected = true; restored = true; }
      optgroup.appendChild(option);
    });

    select.appendChild(optgroup);
  });

  // 如果之前选中的歌曲仍在列表里，保持选中
  if (restored) select.value = selPrev;
}

function populateScheduleTagFilter() {
  const select = document.getElementById('scheduleTagFilter');
  if (!select) return;

  const curVal = select.value;
  select.innerHTML = '<option value="">全部标签</option>';

  if (!allSongs || allSongs.length === 0) return;

  const tags = [...new Set(allSongs.map(s => s.tag || '未分类'))].sort();
  tags.forEach(tag => {
    const opt = document.createElement('option');
    opt.value = tag;
    opt.textContent = `📁 ${tag}`;
    select.appendChild(opt);
  });

  if (tags.includes(curVal)) select.value = curVal;
}

function onScheduleFilterChange() {
  populateSongSelector();
  updateScheduleSearchHint();
}

function updateScheduleSearchHint() {
  const select = document.getElementById('scheduleSong');
  const hint = document.getElementById('scheduleSearchHint');
  if (!select || !hint) return;

  // 统计非占位、非禁用的 option 数量
  const validOptions = select.querySelectorAll('option:not([disabled])');
  const count = Math.max(0, validOptions.length - 1); // 减去"-- 请选择歌曲 --"

  const searchText = (document.getElementById('scheduleSearchInput')?.value || '').trim();
  if (searchText) {
    hint.style.display = 'block';
    hint.textContent = count > 0 ? `✅ 匹配 ${count} 首歌曲，请从下方下拉框选择` : '❌ 没有匹配的歌曲';
    hint.style.color = count > 0 ? 'var(--green)' : 'var(--accent)';
  } else {
    hint.style.display = 'none';
    hint.textContent = '';
  }
}

function handleScheduleSearchEnter() {
  const select = document.getElementById('scheduleSong');
  const validOptions = select.querySelectorAll('option:not([disabled])');
  const count = Math.max(0, validOptions.length - 1);

  if (count === 1) {
    // 只有一首匹配，自动选中
    const firstOption = validOptions[1]; // 跳过占位项
    if (firstOption) {
      select.value = firstOption.value;
      showToast(`已选中: ${firstOption.textContent}`, 'success');
      // 聚焦到时间输入框，方便用户继续操作
      document.getElementById('scheduleTime').focus();
    }
  } else if (count > 1) {
    showToast(`找到 ${count} 首匹配歌曲，请点击下拉框选择`, 'info');
    select.focus();
  } else {
    showToast('没有匹配的歌曲，请尝试其他关键词', 'error');
  }
}

window.editingScheduleId = null;

function editScheduleItem(id) {
  fetch('/api/schedule').then(r => r.json()).then(data => {
    if (!data.ok) return;
    const item = data.items.find(i => i.id === id);
    if (!item) return;

    window.editingScheduleId = id;

    // 填充表单
    document.getElementById('scheduleTime').value = item.time;
    populateSongSelector(); // 先填充列表
    document.getElementById('scheduleSong').value = item.song_path;

    // 切换按钮状态
    const saveBtn = document.querySelector('.btn-add-schedule');
    saveBtn.textContent = '💾 更新任务';
    saveBtn.style.background = 'linear-gradient(135deg, #f59e0b, #d97706)';
    document.getElementById('btnCancelSchedule').style.display = '';

    // 滚动到表单
    document.querySelector('.schedule-form').scrollIntoView({ behavior: 'smooth' });
  });
}

function resetScheduleForm() {
  window.editingScheduleId = null;
  document.getElementById('scheduleTime').value = '';
  document.getElementById('scheduleSong').value = '';

  const saveBtn = document.querySelector('.btn-add-schedule');
  saveBtn.textContent = '💾 保存任务';
  saveBtn.style.background = 'var(--accent-gradient)';
  document.getElementById('btnCancelSchedule').style.display = 'none';
}

async function addSchedule() {
  const timeInput = document.getElementById('scheduleTime');
  const songSelect = document.getElementById('scheduleSong');

  const time = timeInput.value.trim();
  const songPath = songSelect.value;
  const songName = songSelect.options[songSelect.selectedIndex]?.textContent || '';

  const isEditing = !!window.editingScheduleId;
  console.log('[定时] ' + (isEditing ? '更新' : '添加') + '任务:', { time, songPath, songName });

  if (!time) { showToast('请选择播放时间', 'error'); return; }
  if (!songPath) { showToast('请选择歌曲', 'error'); return; }

  const btn = document.querySelector('.btn-add-schedule');
  const origText = btn.textContent;
  btn.textContent = '⏳ 保存中...';
  btn.disabled = true;

  try {
    let url = '/api/schedule';
    let method = 'POST';
    let body = { time, song_path: songPath, song_name: songName, volume: 70 };

    if (isEditing) {
      url = `/api/schedule/${window.editingScheduleId}`;
      method = 'PUT';
    }

    const res = await fetch(url, {
      method,
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    console.log('[定时] 服务器响应:', data);

    if (data.ok) {
      showToast(isEditing ? '✅ 已更新' : '✅ 定时任务已保存', 'success');
      loadSchedules();
      resetScheduleForm();
    } else {
      showToast('保存失败: ' + (data.error || '未知错误'), 'error');
    }
  } catch (e) {
    console.error('[定时] 保存异常:', e);
    showToast('网络错误: ' + e.message, 'error');
  } finally {
    if (!window.editingScheduleId) {
      btn.textContent = origText;
      btn.disabled = false;
    }
  }
}

async function toggleSchedule(id) {
  const itemEl = document.getElementById('schedule-item-' + id);
  const isEnabled = !itemEl.classList.contains('disabled');

  try {
    const res = await fetch(`/api/schedule/${id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ enabled: !isEnabled })
    });
    const data = await res.json();
    if (data.ok) {
      loadSchedules();
    }
  } catch (e) {
    console.error('切换失败:', e);
  }
}

async function deleteSchedule(id) {
  if (!confirm('确定要删除这个定时任务吗？')) return;

  try {
    const res = await fetch(`/api/schedule/${id}`, { method: 'DELETE' });
    const data = await res.json();
    if (data.ok) {
      loadSchedules();
    }
  } catch (e) {
    console.error('删除失败:', e);
  }
}

setInterval(pollStatus, 1000);

// ============================================
// 浮动播放器拖拽（document 事件委托 + 捕获阶段）
// ============================================
(function() {
  let drag = { active: false, startX: 0, startY: 0, initLeft: 0, initTop: 0, el: null };

  document.addEventListener('mousedown', function(e) {
    if (e.button !== 0) return;
    const fp = document.getElementById('floatingPlayer');
    if (!fp) return;
    if (!fp.contains(e.target)) return;
    if (e.target.closest('button')) return;

    const rect = fp.getBoundingClientRect();
    drag.active = true;
    drag.el = fp;
    drag.startX = e.clientX;
    drag.startY = e.clientY;
    drag.initLeft = rect.left;
    drag.initTop = rect.top;
    fp.style.left = rect.left + 'px';
    fp.style.top = rect.top + 'px';
    fp.style.transform = 'none';
    fp.classList.add('dragging');
    e.preventDefault();
    e.stopPropagation();
  }, true);

  document.addEventListener('mousemove', function(e) {
    if (!drag.active) return;
    drag.el.style.left = Math.max(0, drag.initLeft + e.clientX - drag.startX) + 'px';
    drag.el.style.top = Math.max(0, drag.initTop + e.clientY - drag.startY) + 'px';
  });

  document.addEventListener('mouseup', function() {
    if (!drag.active) return;
    drag.el.classList.remove('dragging');
    drag.active = false;
  });
})();
